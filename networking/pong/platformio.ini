; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; The host role has two builds (the CYD firmware and the SDL2 simulator) and the
; controller role has two (P1 and P2). No environment filters its sources: every
; env compiles every file in src/, and the role macro (NET_PONG_ROLE_HOST /
; NET_PONG_ROLE_CONTROLLER) plus the transport header select what is actually
; instantiated.

; -----------------------------------------------------------------------------
; native — the SDL2 simulator. It is meant to run the host session plus the two
; controller sessions in one window over a LoopbackBus, so the protocol and the
; rules can be exercised without three boards on the desk. The scaffold wires
; only the host node so far; the two simulated controllers are added with the
; host session adapter, because only the host knows what the controllers are
; told. The canvas is the host's 320x240 design canvas.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=320
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_CAMERA_EFFECTS=1
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D NET_PONG_ROLE_HOST=1
    -Isrc
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32cyd_host — the ESP32-2432S028 "Cheap Yellow Display" runs the match.
;
; Device configuration follows games/chess (board, ILI9341_2 pin map, TFT_BL 21,
; DAC speaker on GPIO 26 at 22050 Hz). The one deliberate difference is the
; canvas: chess is a 240x320 portrait, touch-driven build, while Pong wants a
; 320x240 landscape court. So the panel keeps DISPLAY_ROTATION=3 and LOGICAL_*
; stays deliberately unset — the engine swaps the logical size with the
; physical one for the quarter turn, and hand-setting 320x240 would be swapped
; back to 240x320.
;
; There is no touch panel here: the paddles come from the two C3 controllers
; over ESP-NOW, so PIXELROOT32_ENABLE_TOUCH keeps its default of 0 and the
; XPT2046 bus is never claimed.
; -----------------------------------------------------------------------------
[env:esp32cyd_host]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32CYD
    -D NET_PONG_ROLE_HOST=1
    ; TFT config (ILI9341_2 240x320), copied from games/chess
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; A quarter turn: the panel is portrait, the logical framebuffer landscape.
    -D DISPLAY_ROTATION=3
    ; Feature budget. Audio and particles are the arcade feedback; physics and
    ; the UI system are not used by this demo's hand-written rules core.
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    ; The engine gates every 4bpp draw path with #ifdef, so a bare define is the
    ; only spelling that turns the generated ball and paddle sprites on.
    -D PIXELROOT32_ENABLE_4BPP_SPRITES
    -D PIXELROOT32_ENABLE_CAMERA_EFFECTS=1
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; esp32c3_p1 / esp32c3_p2 — DFRobot Beetle ESP32-C3 controllers.
;
; The two environments build the same translation unit. ESP_NOW_NODE_ID is the
; whole difference: 2 is Player 1, 3 is Player 2, and the platform header
; rejects any other value at compile time so a copy-pasted environment cannot
; silently become a third node the host fan-out has no paddle for.
;
; The panel is the on-board 0.42" SSD1306: 128x64 framebuffer used in full
; (X/Y_OFF_SET 0), so the scoreboard can use the whole canvas. Buttons are
; GPIO 3 (left) and GPIO 1 (right), wired to GND; InputManager applies
; INPUT_PULLUP to every pin it is given.
;
; Every optional subsystem is compiled out: the controller only sends held
; direction and paints a scoreboard, so audio, particles, physics and UI would
; be flash and RAM nothing on this board ever reads.
; -----------------------------------------------------------------------------
[env:esp32c3_p1]
extends = base_esp32
board = dfrobot_beetle_esp32c3
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
build_flags =
    ${base_esp32.build_flags}
    -O2
    -Isrc
    -D NET_PONG_ROLE_CONTROLLER=1
    -D ESP_NOW_NODE_ID=2
    ; Selects U8G2_Drawer over the default TFT_eSPI path.
    -D PIXELROOT32_USE_U8G2
    -D PHYSICAL_DISPLAY_WIDTH=128
    -D PHYSICAL_DISPLAY_HEIGHT=64
    -D LOGICAL_WIDTH=128
    -D LOGICAL_HEIGHT=64
    -D X_OFF_SET=0
    -D Y_OFF_SET=0
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0

[env:esp32c3_p2]
extends = base_esp32
board = dfrobot_beetle_esp32c3
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
build_flags =
    ${base_esp32.build_flags}
    -O2
    -Isrc
    -D NET_PONG_ROLE_CONTROLLER=1
    -D ESP_NOW_NODE_ID=3
    -D PIXELROOT32_USE_U8G2
    -D PHYSICAL_DISPLAY_WIDTH=128
    -D PHYSICAL_DISPLAY_HEIGHT=64
    -D LOGICAL_WIDTH=128
    -D LOGICAL_HEIGHT=64
    -D X_OFF_SET=0
    -D Y_OFF_SET=0
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0

; -----------------------------------------------------------------------------
; host_test — host-only Unity tests for the engine-free layers under src/.
;
; Adapted from games/chess: `platform = native`, C++17, Unity, and a
; build_src_filter that names exactly the dependency-free directories, so the
; suite needs no display, no SDL2 and no ESP-NOW radio. Only src/net/ exists
; today; +<game/> is listed ahead of the rules core so growing the test surface
; later does not mean editing this environment again — an empty filter entry
; simply matches no file.
;
; The engine stays declared at the same version as the four target envs so the
; pin lives in one project, but it is NOT built here (lib_ignore, same posture as
; chess's dialog_test): building the engine on `native` drags in the SDL2
; simulator and the TFT drivers, which nothing in src/net/ or src/game/ touches.
; -----------------------------------------------------------------------------
[env:host_test]
platform = native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
lib_ignore = PixelRoot32-Game-Engine
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<net/> +<game/>
test_framework = unity
test_build_src = true

; -----------------------------------------------------------------------------
; net_test — the three-node integration suite over the real engine session.
;
; host_test above proves the two engine-free layers; it deliberately ignores the
; engine, so it cannot exercise NetSession, the loopback transport or anything
; the host adapter does over them. This environment is the opposite posture:
; it extends [env:native] (PLATFORM_NATIVE, PIXELROOT32_ENABLE_NETWORKING=1 and
; the engine dependency, with no lib_ignore), so NetSession and LoopbackTransport
; are compiled by the real engine and linked against three real sessions.
;
; src/main.cpp, the two scenes and src/platforms/ stay out of the test binary:
; build_src_filter names only the directories the integration suite needs, so no
; SDL window and no display driver is pulled into the runner. The engine library
; is still built by the native platform, which is why the SDL2 include and link
; flags are inherited from [env:native] rather than guessed here.
; -----------------------------------------------------------------------------
[env:net_test]
extends = env:native
test_framework = unity
build_flags =
    ${env:native.build_flags}
    -D UNITY_SUPPORT_64
build_src_filter = +<net/> +<game/>
test_build_src = true
