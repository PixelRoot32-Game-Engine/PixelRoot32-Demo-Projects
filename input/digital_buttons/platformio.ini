; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; -----------------------------------------------------------------------------
; native — SDL2 simulator. InputConfig carries SDL scancodes here instead of
; GPIO numbers, and InputManager indexes SDL's keyboard state array with them.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.9.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=128
    -D PHYSICAL_DISPLAY_HEIGHT=128
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32dev — generic ESP32 + ST7735 128x128. Six buttons to ground on the GPIOs
; listed in src/platforms/esp32_dev.h; InputManager wires them INPUT_PULLUP and
; reads them active-low, so no external resistors are needed.
; -----------------------------------------------------------------------------
[env:esp32dev]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.9.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=128
    -D PHYSICAL_DISPLAY_HEIGHT=128
    -D PLATFORM_ESP32DEV
    ; TFT config (ST7735 128x128)
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER
    -D ST7735_GREENTAB3
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; host_test — host-only unit tests for src/patterns/. That layer includes no
; engine header on purpose, so `pio test -e host_test` needs neither SDL2 nor a
; display and runs every suite under test/ (test_input_patterns).
; -----------------------------------------------------------------------------
[env:host_test]
platform = native
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<patterns/>
test_framework = unity
test_build_src = true
