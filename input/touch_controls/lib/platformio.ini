; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; --- Engine features used by this demo ---
    ; The topic. This flag gates the ENGINE, and only the Engine: with it at 0
    ; the Engine's own TouchEventDispatcher, its getTouchDispatcher() accessor
    ; and the per-frame block that pumps events into Scene::processTouchEvents()
    ; are all compiled out. Nothing else moves -- InputManager still embeds a
    ; TouchEventDispatcher unconditionally and TouchEventDispatcher.h carries no
    ; #if at all -- so a build with this at 0 still compiles and links. It just
    ; never delivers a gesture. The failure mode is a dead screen, not an error.
    -D PIXELROOT32_ENABLE_TOUCH=1
    ; --- Explicitly off (these ARE #if-tested, so =0 works) ---
    ; Defaults to 1. This demo is silent, and audio is the most expensive
    ; default in the engine: roughly 17 KB of RAM for voice state and mixing
    ; buffers that nothing here would ever write to.
    -D PIXELROOT32_ENABLE_AUDIO=0
    ; Defaults to 1. Nothing collides: the scene owns no Actor and no entity at
    ; all, it draws primitives. Roughly 9 KB of RAM for CollisionSystem and
    ; SpatialGrid that would sit reserved and unused.
    -D PIXELROOT32_ENABLE_PHYSICS=0
    ; Defaults to 1. No effects. Roughly 2 KB of RAM for the emitter pool.
    -D PIXELROOT32_ENABLE_PARTICLES=0
    ; Defaults to 1, and turning it off is the point rather than a saving.
    ; Scene::processTouchEvents() runs UIManager::processEvents() FIRST and lets
    ; it mark events consumed; only what survives reaches
    ; onUnconsumedTouchEvent(). This demo is about the layer BELOW that, so it
    ; registers no widgets and draws its readout with Renderer primitives. With
    ; the UI system compiled out, every event the state machine produces reaches
    ; the scene unconsumed and gets logged.
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
