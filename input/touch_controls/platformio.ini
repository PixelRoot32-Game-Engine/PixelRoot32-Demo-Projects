; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; -----------------------------------------------------------------------------
; native — SDL2 simulator. SDL2_Drawer::processEvents() converts every
; SDL_MOUSEBUTTONDOWN / SDL_MOUSEBUTTONUP / SDL_MOUSEMOTION into a
; TouchEventDispatcher::processTouch() call, so the mouse enters the pipeline at
; exactly the point an XPT2046 panel does and the layout matches the CYD 1:1.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.9.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -Isrc
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32cyd — ESP32-2432S028 "Cheap Yellow Display": ILI9341 240x320 + XPT2046
; resistive touch. This demo ships no esp32dev environment for the same reason
; games/chess does not: touch is the entire interaction model and the generic
; ST7789 board has no panel to touch. Touch wiring and calibration follow
; games/chess, which follows the engine's 2048 example.
;
; TOUCH_DRIVER_XPT2046 is what selects a driver inside TouchManager.
; PIXELROOT32_ENABLE_TOUCH does not: setting the feature flag without a
; TOUCH_DRIVER_* define still leaves the hardware unread.
; -----------------------------------------------------------------------------
[env:esp32cyd]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.9.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32CYD
    ; TFT config (ILI9341_2 240x320)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; Touch: XPT2046 on its own GPIO bus (32/39/25/33, IRQ 36), not on the TFT SPI
    -D TOUCH_DRIVER_XPT2046
    -D XPT2046_USE_GPIO_SPI
    -D XPT2046_GPIO_VENDOR_COORDS=0
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
    ; ADC X/Y are swapped vs the display on the 2432S028
    -D XPT2046_GPIO_SWAP_AXES=1
    ; Horizontal mirror: left/right are inverted after the axis swap
    -D XPT2046_GPIO_MIRROR_X=1
    ; Map the usable ADC range onto the full screen (resistive rarely reaches 0-4095).
    ; Retune LO/HI by touching the corners and reading the serial monitor.
    -D XPT2046_GPIO_USE_RAW_RANGE=1
    -D XPT2046_RAW_X_LO=320
    -D XPT2046_RAW_X_HI=3820
    -D XPT2046_RAW_Y_LO=320
    -D XPT2046_RAW_Y_HI=3820
    ; Applied after the mirror, in final screen space
    -D XPT2046_CAL_OFFSET_X=0
    -D XPT2046_CAL_OFFSET_Y=0
    -Isrc
    -O2
