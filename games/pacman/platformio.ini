; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.12.0
build_flags =
    ${base_native.build_flags}
    ; The arcade screen is 224x288: 28 cells of 8 pixels plus the score rows
    ; and the lives rows. The simulator takes that shape.
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=288
    -D PACMAN_CELL_SIZE=8
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) -- uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32dev_ST7789]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.12.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PLATFORM_ESP32DEV_ST7789
    ; The level is 28 cells wide and 31 cells tall: at eight pixels it needs
    ; 248 rows, which a 240-pixel panel does not have. Seven pixels fits.
    -D PACMAN_CELL_SIZE=7
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; The ESP32-2432S028 "Cheap Yellow Display": an ILI9341 240x320 panel with
; an XPT2046 resistive touch screen. The panel is mounted in portrait and is
; left that way: the arcade screen is 224x288, so a tall panel is the shape
; this game wants. The touch bus is left unclaimed: the game is played with
; the six buttons.
[env:esp32dev_ILI9341]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.12.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32DEV_ILI9341
    -D PACMAN_CELL_SIZE=8
    ; TFT config (ILI9341 240x320)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; rules_test -- host-only unit tests for src/rules/, the game rules.
;
; The rules layer uses the engine's gameplay primitives -- GridMotion and
; GridSpace -- so the engine is installed for its headers but NOT built as a
; library: building it would drag the SDL2 simulator in, and the CI test job
; deliberately installs no SDL2. The rules layer never reaches the drawing
; system, the input device or the audio backend, so it compiles and runs with
; no display at all.
;
; test/support/Arduino.h stands in for the one Arduino symbol EngineConfig.h
; reads.
; -----------------------------------------------------------------------------
[env:rules_test]
platform = native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.12.0
lib_ignore = PixelRoot32-Game-Engine
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -D PIXELROOT32_ENABLE_GAMEPLAY_GRID_SPACE=1
    -Isrc
    -Itest/support
    -I.pio/libdeps/rules_test/PixelRoot32-Game-Engine/include
    -O2
    -Wall
    -Wextra
build_src_filter = +<rules/>
test_framework = unity
test_build_src = true
test_filter = unit/*
