; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
; Temporary: the Dialog System only exists on the engine's feature branch.
; Repin to gperez88/PixelRoot32-Game-Engine@^1.11.0 once 1.11.0 is released.
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/dialog-system
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=320
    -D PHYSICAL_DISPLAY_HEIGHT=240
    ; -D PIXELROOT32_ENABLE_DEBUG_OVERLAY
    ; -D PIXELROOT32_ENABLE_PROFILING
    ; -D PIXELROOT32_DEBUG_MODE
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32dev]
extends = base_esp32
board = esp32dev
framework = arduino
; Temporary: the Dialog System only exists on the engine's feature branch.
; Repin to gperez88/PixelRoot32-Game-Engine@^1.11.0 once 1.11.0 is released.
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/dialog-system
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    ; Deliberately NOT built with PIXELROOT32_ENABLE_DEBUG_OVERLAY here, unlike
    ; [env:native]. Engine.cpp forces `redraw = true` whenever that flag is set,
    ; which disables the present() skip that CityScene::shouldRedrawFramebuffer()
    ; exists to trigger -- the overlay would cost the very 40 ms frame it is
    ; measuring. PIXELROOT32_DEBUG_MODE and _ENABLE_PROFILING go with it: they
    ; are simulator tools, and on hardware they only add flash and serial noise.
    ; The hardware numbers in ROADMAP.md were taken with those two temporarily
    ; on and the overlay still off, so their serial traffic is inside those
    ; numbers and no control run without them exists.
    -D PLATFORM_ESP32DEV
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ; 12-bit colour (MIPI DCS COLMOD 0x03). Sending 12 bits per pixel instead
    ; of 16 removes a quarter of the panel transfer, which is worth having --
    ; but it is not what sets the frame rate here, and an earlier version of
    ; this comment claimed it was. Measured on an esp32dev: the whole present
    ; costs 14.7 ms, of which 9.7 ms is the DMA. Draw costs 21 ms. The panel is
    ; the cheaper half of the frame, not the bottleneck; the three full-screen
    ; Static tilemap layers are. See the hardware numbers in ROADMAP.md.
    ;
    ; Two preconditions, both checked rather than assumed:
    ;   - The driver silently keeps RGB565 unless the physical width is a
    ;     multiple of 4 (a packed line has to end on a whole DMA word).
    ;     240 % 4 == 0.
    ;   - RGB444 keeps only the top 4 bits of each channel, so two palette
    ;     entries can collapse into one. `python tools/check_rgb444.py` counts
    ;     them across all 15 shipped palettes: 2 pairs in daylight, both of
    ;     them shades that were within one step of each other already
    ;     (NATURE DIRT/TAN_2 and URBAN PLAZA_DARK/WHITE).
    ;
    ;     The day/night tint makes this worse and there is no fixing it in the
    ;     art: darkening compresses every palette toward black, so at full
    ;     night 10 pairs collide
    ;     (`python tools/check_rgb444.py --ambient 88,104,160`). The city
    ;     loses some of its shading after dark on hardware and none of it on
    ;     the simulator. That is the price of the 12-bit transfer, not a bug
    ;     in the cycle -- set this to 0 and both numbers go to zero.
    ;
    ; Requires a panel that accepts COLMOD 0x03. Set this to 0 if the display
    ; comes up garbled.
    -D PIXELROOT32_TFT_12BIT_COLOR=1
    -Isrc
    -Os

; -----------------------------------------------------------------------------
; host_test — host-only unit tests for everything under src/game/rules/.
;
; That directory is the whole contract: nothing in it includes an engine
; header, so `pio test -e host_test` needs no display, no framebuffer and no
; board. The source filter names the directory rather than the files, so a new
; rule is covered by adding it there -- and a rule that quietly grows an engine
; dependency breaks this build, which is the point of keeping them apart.
; -----------------------------------------------------------------------------
[env:host_test]
platform = native
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<game/rules/>
test_framework = unity
test_build_src = true
