; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; The city has a wanted level, a weapon and an arrest, and none of them
    ; had a sound: the gun was mute, the siren was a HUD row, and getting
    ; caught was silent. This is the read of that state -- one gunshot,
    ; one arrest, seven one-shots and (from a later slice) a chase siren --
    ; costing ~17 KB RAM / ~15 KB Flash, which is the audio subsystem's own
    ; RAM-dominant cost per the memory-optimization skill's measured deltas.
    ; No other subsystem below moved to make room for it.
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    ; Collision is a per-tile lookup in this demo's own code, not an engine
    ; collider graph: a 128x128 city would otherwise need thousands of static
    ; actors, which does not fit an ESP32.
    -D PIXELROOT32_ENABLE_PHYSICS=0
    ; The city is free-roam, not grid-locked, so GridSpace stays out.
    -D PIXELROOT32_ENABLE_GAMEPLAY_GRID_SPACE=0
    ; Stage 2's pedestrians are a fixed slab of slots streamed around the
    ; camera, which is exactly what the engine's ObjectPool is: placement-new
    ; over aligned storage, no heap, and acquire/release inside the game loop.
    ; Without this flag ObjectPool.h compiles to nothing and the crowd will
    ; not build.
    -D PIXELROOT32_ENABLE_GAMEPLAY_OBJECT_POOL=1
    ; One actor on top of one tilemap: no depth sorting needed.
    -D PIXELROOT32_ENABLE_DEPTH_SORT=0
    ; The tileset and the player are 4bpp (16 colours). 2bpp stays off.
    -D PIXELROOT32_ENABLE_4BPP_SPRITES
    ; Selective framebuffer clear. All three tilemap layers are drawn as
    ; LayerType::Static, which suppresses per-cell dirty marking, so the only
    ; cells marked in a frame are the ones the player sprite and the HUD
    ; actually touched. beginFrame() then clears those instead of memsetting
    ; the whole 57,600-byte logical framebuffer -- and the clear was redundant
    ; anyway, because the opaque Background layer covers the viewport edge to
    ; edge every frame.
    ;
    ; This does NOT shorten the panel transfer: Renderer::endFrame() calls
    ; sendBuffer() unconditionally, so the full frame still goes out over SPI.
    ; The engine skips the dirty grid entirely on native (no 8bpp framebuffer
    ; behind SDL2), so this flag is an ESP32-only win.
    -D PIXELROOT32_ENABLE_DIRTY_REGIONS=1

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
