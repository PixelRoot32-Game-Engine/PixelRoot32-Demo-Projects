; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES
;
; The Pong demo teaches one idea: a physics-driven arcade court played by one
; player against a CPU paddle. The flag list therefore keeps the engine pieces
; that court leans on -- the physics solver, audio, particles and camera shake,
; plus the 4bpp sprite path the generated ball and paddles use -- while the UI
; widget system stays off because the court is drawn by hand.

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    ; The retiring physics scene still uses rigid bodies. T5 deletes that scene
    ; and flips this switch to 0 along with the damping knobs below.
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    -D PIXELROOT32_ENABLE_CAMERA_EFFECTS=1
    ; The engine gates every 4bpp draw path with #ifdef, so a bare define turns
    ; the generated ball and paddle sprites on.
    -D PIXELROOT32_ENABLE_4BPP_SPRITES
    ; Physics timestep tuning for the old scene: the ball must not lose energy
    ; across bounces. Both values are physics-only and go away with it in T5.
    -D PIXELROOT32_VELOCITY_DAMPING=0.999
    -D PIXELROOT32_MAX_VELOCITY=500

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
