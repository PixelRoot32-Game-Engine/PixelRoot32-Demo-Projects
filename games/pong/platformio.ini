; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; Two canvases, one court. The arcade court is authored for a landscape box:
; 240 wide on the square ST7789 panel, and 320 wide on the ILI9341 panel after
; its quarter turn (a 240x320 portrait panel rotated to 320x240). Each
; environment therefore states PONG_COURT_WIDTH explicitly and it must equal
; that environment's logical width -- the court layout refuses to compile when
; the composition does not fit. The SDL2 window mirrors the ST7789 build,
; because the square panel is the board this demo was written for.

; -----------------------------------------------------------------------------
; native — the SDL2 simulator. It mirrors the ST7789 board: a 240x240 canvas,
; arrow-key movement and Space to restart.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PONG_COURT_WIDTH=240
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32dev_ST7789 — a 240x240 ST7789 panel, the original board. The court fills
; the square canvas, so PONG_COURT_WIDTH is 240.
; -----------------------------------------------------------------------------
[env:esp32dev_ST7789]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PLATFORM_ESP32DEV_ST7789
    -D PONG_COURT_WIDTH=240
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; esp32dev_ILI9341 — the ESP32-2432S028 "Cheap Yellow Display": an ILI9341
; 240x320 panel mounted in portrait. The build rotates it a quarter turn, so the
; logical framebuffer is 320x240 and PONG_COURT_WIDTH is 320. The touch bus is
; left unclaimed: the game is played with the six buttons.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.13.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32DEV_ILI9341
    -D PONG_COURT_WIDTH=320
    ; TFT config (ILI9341 240x320)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    ; A quarter turn: the panel is portrait, the logical framebuffer landscape.
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2
