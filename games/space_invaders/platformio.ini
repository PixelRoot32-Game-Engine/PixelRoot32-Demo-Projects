; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.9.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    ; A full wave is 72 entities (1 player + 55 aliens + 4 shields + 12 shots)
    ; and the engine defaults both lists to 64, which silently dropped the rest.
    -D MAX_ENTITIES=80
    -D PHYSICS_MAX_ENTITIES=80
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32dev_ST7789]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.9.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PLATFORM_ESP32DEV_ST7789
    ; Same 72-entity wave as the native target; the engine default of 64 is short.
    -D MAX_ENTITIES=80
    -D PHYSICS_MAX_ENTITIES=80
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; The ESP32-2432S028 "Cheap Yellow Display": an ILI9341 240x320 panel with an
; XPT2046 resistive touch screen. The panel is mounted in portrait and is turned
; a quarter turn, so the logical framebuffer becomes 320x240 -- the landscape
; shape the board is held in. The touch bus is left unclaimed: the game is
; played with the six buttons. The playfield stays 224 px wide and is centred
; instead of sitting at x=8: (320 - 224) / 2 = 48, so it spans 48..272 and its
; centre is the canvas centre, which keeps the centred HI-SCORE and game-over
; lines over the field.
[env:esp32dev_ILI9341]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.9.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32DEV_ILI9341
    ; Same 72-entity wave as the native target; the engine default of 64 is short.
    -D MAX_ENTITIES=80
    -D PHYSICS_MAX_ENTITIES=80
    ; Centred playfield on the 320 px landscape canvas: (320 - 224) / 2 = 48.
    -D SPACE_INVADERS_FIELD_X=48
    ; TFT config (ILI9341 240x320)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    ; A quarter turn: the panel is portrait, the logical framebuffer landscape.
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; host_test — host-only unit tests for src/rules/. That layer has no engine
; dependency on purpose, so `pio test -e host_test` needs no display and runs
; every suite under test/. The filter matches nothing until T1.2 adds sources.
; -----------------------------------------------------------------------------
[env:host_test]
platform = native
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<rules/>
test_framework = unity
test_build_src = true
