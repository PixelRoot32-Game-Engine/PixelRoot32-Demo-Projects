; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.12.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32dev_ST7789]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.12.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PLATFORM_ESP32DEV_ST7789
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; The ESP32-2432S028 "Cheap Yellow Display": an ILI9341 240x320 panel with an
; XPT2046 resistive touch screen. The panel is mounted in portrait and is turned
; a quarter turn, so DisplayConfig swaps the logical size to 320x240 -- the
; landscape canvas the 240x240 composition is centred on with a 40 px margin on
; each side. LOGICAL_WIDTH/LOGICAL_HEIGHT are deliberately NOT set here: they
; must keep describing the panel as mounted (240x320), because the engine swaps
; them for the quarter turn. Hand-setting them to 320x240 would be swapped back
; to 240x320 and the scene would think its canvas was the portrait shape.
; The touch bus is left unclaimed: the game is played with the six buttons, so
; PIXELROOT32_ENABLE_TOUCH stays at its default of 0.
[env:esp32dev_ILI9341]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.12.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32DEV_ILI9341
    ; TFT config (ILI9341 240x320)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    ; A quarter turn: the panel is portrait, the logical framebuffer landscape.
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; host_test — host-only unit tests for the engine-free layers (src/game/,
; src/input/, src/presentation/). Those layers have no engine dependency on
; purpose, so `pio test -e host_test` needs no display and runs every suite
; under test/ (test_minefield, test_reveal, test_game_session, test_input,
; test_presentation).
; -----------------------------------------------------------------------------
[env:host_test]
platform = native
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<game/> +<input/> +<presentation/>
test_framework = unity
test_build_src = true
