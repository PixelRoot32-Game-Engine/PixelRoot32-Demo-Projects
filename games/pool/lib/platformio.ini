; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; --- Engine features this demo does NOT use ---
    ; The balls run on the demo's own fixed-point core (src/pool/), not the
    ; engine's float-based Scalar physics, and there are no segment colliders
    ; to gain from it. Costs ~9 KB when on.
    -D PIXELROOT32_ENABLE_PHYSICS=0
    ; v1 is silent. ~17 KB, nearly all of it the scheduler's own buffers.
    -D PIXELROOT32_ENABLE_AUDIO=0
    ; The HUD is drawText plus rectangles, hand-drawn in the scene. ~9 KB.
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    ; No particle effects in v1. ~2 KB.
    -D PIXELROOT32_ENABLE_PARTICLES=0
    ; A single scene for the whole game — nothing to transition between.
    -D PIXELROOT32_ENABLE_SCENE_TRANSITIONS=0
    ; No tilemaps; the table is drawn from row spans, not a static cache.
    -D PIXELROOT32_ENABLE_STATIC_TILEMAP_FB_CACHE=0

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
