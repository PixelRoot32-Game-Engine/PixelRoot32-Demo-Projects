; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES
;
; DOOM is not a PixelRoot32 game that happens to draw: it brings its own
; renderer, its own game loop and its own fixed-point math. What the engine
; provides here is the layer underneath -- an 8bpp surface, the scaled
; 8bpp->panel present path, input and the APU audio backend. So the flag list
; keeps audio and turns off everything DOOM replaces: no rigid bodies, no
; particle system, no widget tree, no camera effects, and no engine sprite
; blitting on the hot path.

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; The APU synthesis backend is the whole audio story of this port: no PCM
    ; sample channel, no OPL2, no DMX decode (docs/plan-doom-esp32.md 3.7).
    -D PIXELROOT32_ENABLE_AUDIO=1
    ; DOOM's own simulation owns every moving thing; the engine's solver would
    ; be a second, conflicting source of truth.
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    -D PIXELROOT32_ENABLE_CAMERA_EFFECTS=0

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    ; The drawer allocates TWO DMA line buffers of
    ; physicalWidth * 2 B * linesPerBlock each, in DMA-capable internal RAM.
    ; The default is 60, which at a 240 px window costs 57,600 B -- 38,400 B
    ; more than the DRAM budget of docs/plan-doom-esp32.md 6.3 allows for this
    ; row, and enough to put the 320-wide window over the limit on its own.
    ; 20 lines is the size that budget assumed; Phase 0 D0.2 measures the
    ; frame-time cost of moving it, and that measurement owns any change here.
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=60
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
