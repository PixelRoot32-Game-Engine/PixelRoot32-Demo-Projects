; world_test -- host-only tests for the world core, with every map assembled in
; the test file and the zone a local array. `#include "p_setup.h"` builds
; p_setup.c and everything it reaches (p_mobj.c, p_tick.c, p_action.c,
; m_random.c, z_zone.c, doom_map.c, r_bsp.c and the generated tables) as C; no
; test_build_src.
[env:world_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
