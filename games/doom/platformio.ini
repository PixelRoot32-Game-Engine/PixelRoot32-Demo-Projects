; frameprof_test -- host-only tests for the frame-driver arithmetic, filtering
; src/ to the engine-free, esp_timer-free first half of
; src/doomc/FrameDriver.cpp with no library dependency.
; `PIXELROOT32_DOOM_FRAME_PROBE` is absent on purpose: the last case is the
; disabled build (kFrameProbeEnabled false, FrameProfileReport<false>::frame()
; writes nothing), and the enabled form is instantiated explicitly in the same
; binary.
[env:frameprof_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/FrameDriver.cpp>
test_filter = unit/test_frameprof*

; save_test -- host-only tests for the save record and its differential gate. The
; suite builds a real E1M1 from tools/DOOM1.WAD (copyrighted shareware, not
; committed: point DOOM_WAD at it, or leave it at tools/DOOM1.WAD, which is where
; the gate scripts expect it). `#include "p_setup.h"` (through SaveGame.h) builds
; lib/doom as a library as world_test does; -Isrc plus the filter compiles the
; writer/reader under test.
[env:save_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/SaveGame.cpp>
test_filter = unit/test_save*

; level_test -- the level transition driven through the real switch: the
; composition between G_DoCompleted's switch and G_DoWorldDone's load lives in
; src/doomc/LevelTransition.* (engine-free), so the suite cannot prove a path the
; firmware does not take. It builds real maps from tools/DOOM1.WAD and sends
; BT_USE through p_level_tic -> P_PlayerThink -> p_use_lines, as a held B button
; does; SaveGame.cpp is compiled for the round-trip case. DOOM_WAD supplies the
; data, as in save_test.
[env:level_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/LevelTransition.cpp> +<doomc/SaveGame.cpp>
test_filter = unit/test_level*

; input_test -- host-only tests for the button -> ticcmd mapping: a pure function
; with no clock, engine, display or allocation, so only src/doomc/InputMap.cpp is
; compiled and there is no library dependency. `#include "p_user.h"` builds
; lib/doom as a library, and the mapping calls no C function.
[env:input_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/InputMap.cpp>
test_filter = unit/test_input*

; menu_test -- host-only tests for the menu's persistence seam and palette
; effect: the C++ seams tools/menu_check.py cannot see from C (SettingsStore.h
; over an in-memory store, the LOAD/SAVE navigation, palette::applyGamma()).
[env:menu_test]
platform = native
test_framework = unity
test_build_src = true
; The settings seam has an implementation over the engine's `IKeyValueStore`.
; This environment compiles that header (header-only: the interface plus the
; in-RAM adapter) but links no engine object, so the engine is declared as a
; dependency to put its include directory on the path; the build filter below
; still compiles only this suite and the palette it uses.
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.14.1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
    ; The persistence module is switched on for the preprocessor.
    -D PIXELROOT32_ENABLE_PERSISTENCE=1
    -D DOOM_PERSISTENCE=1
    ; The engine's own platform switch: without it EngineConfig.h wants the real
    ; Arduino.h, which a native environment does not have. env:native sets it the
    ; same way through [base_native], and SDL_MAIN_HANDLED keeps SDL from
    ; renaming this file's `main` to `SDL_main` (the engine's host headers pull
    ; SDL in; there is no window in this suite).
    -D PLATFORM_NATIVE=1
    -D SDL_MAIN_HANDLED=1
build_src_flags =
    -fno-exceptions
build_src_filter = +<palette/DoomPalette.cpp>
test_filter = unit/test_menu*

; boot_test -- host-only tests for the boot/failure screens: every WHD open code
; reaches a reason, the taxonomy's titles/bodies/hints obey the embedded font and
; the 25-character line, and the painter writes inside a 1x1 and a 320x200
; buffer. Only the two engine-free translation units are built; doomc/WhdSource.h
; is included for its macros and no flash adapter source is compiled.
[env:boot_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/BootScreen.cpp> +<doomc/LevelFailure.cpp>
test_filter = unit/test_boot*

; sound_test -- host-only tests for DOOM's channel layer and the SFX bank:
; lib/doom/s_sound.c is compiled as C against a test double for the seven seam
; functions, so the channel table, priority steal, link rule, distance culling
; and M_Random jitter are exercised with no board, engine or audio device;
; src/doomc/SfxBank.cpp is compiled by build_src_filter for the 108 cues and the
; pure 8 -> 4 selector. `#include "s_sound.h"` builds s_sound.c and sounds.c as C.
[env:sound_test]
platform = native
test_framework = unity
test_build_src = true
; The bank carries its ADSR as an `InstrumentPreset` (AudioEvent has no other
; channel for it), so this env needs the APU header; same registry dependency the
; engine declares, so both resolve to 2.x.
lib_deps = gperez88/PixelRoot32-APU@^2.3.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    ; The native profile's music bank is the full one, so the nine-theme
    ; assertions in test_sound exercise the branch the native build links.
    -D DOOM_FULL_PROFILE=1
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/SfxBank.cpp> +<doomc/MusicBank.cpp> +<doomc/AudioTelemetry.cpp>
test_filter = unit/test_sound*
