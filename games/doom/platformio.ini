; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; One surface, two windows. DOOM renders 320x200 and that number is structural,
; not a knob: SCREENWIDTH sizes distscale[], every visplane_t (top[320] /
; bottom[320]), floorclip/ceilingclip and the status bar layout. So LOGICAL is
; 320x200 on every environment and only PHYSICAL changes -- the drawer's xLUT
; picks the window out of the logical surface (320 -> 240 is 0.75, a skip, not
; an upscale). Both platform headers static_assert this.
;
; The engine is pinned by branch, never by a local symlink dependency: the
; port tracks the APU branch work through the demo's own tracker branch
; (docs/plan-doom-esp32.md 4.6). No pull request against develop is opened from
; either tracker branch.

; -----------------------------------------------------------------------------
; native -- the SDL2 simulator. It mirrors the primary board: a 240x180 window
; letterboxed out of the same 320x200 logical surface the panel shows.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/doom-esp32
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=180
    -D LOGICAL_WIDTH=320
    -D LOGICAL_HEIGHT=200
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) -- uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32dev_ST7789 -- the primary DOOM target: the square 240x240 board pong was
; written for. The panel shows a 240x180 window centred vertically (30 px bars),
; which is the whole 320x200 surface squashed 0.75x. Pin map from
; games/pong/src/platforms/esp32_dev_ST7789.h.
; -----------------------------------------------------------------------------
[env:esp32dev_ST7789]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/doom-esp32
build_flags =
    ${base_esp32.build_flags}
    -D PLATFORM_ESP32DEV_ST7789
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=180
    -D LOGICAL_WIDTH=320
    -D LOGICAL_HEIGHT=200
    ; (240 - 180) / 2: the window is centred, the bars stay black.
    -D Y_OFF_SET=30
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; The ILI9341 320x240 CYD environment is deliberately absent until Phase 1.
;
; DisplayConfig::applyRotationNormalization() (include/graphics/DisplayConfig.h)
; swaps width and height for odd rotations, so a build that asks for a 320x200
; window with DISPLAY_ROTATION=3 gets a 200x320 one on a panel whose rotated
; frame is 320x240 -- the address window then runs off the panel. Passing the
; values pre-swap instead makes every logical macro read 200x320, which is the
; opposite of what S8 states and of what the rasteriser will assume.
;
; Phase 0 measures that panel anyway: games/doom/bench/ drives TFT_eSPI_Drawer
; directly, without DisplayConfig, for D0.6. The environment returns once the
; rotation/sub-window question is settled, which is an engine-side decision and
; therefore Phase 1 work, not scaffold work.
