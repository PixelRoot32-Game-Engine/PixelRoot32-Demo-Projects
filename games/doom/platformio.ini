; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; One surface, one window, 1:1. DOOM renders 320x200 and that number is
; structural, not a knob: SCREENWIDTH sizes distscale[], every visplane_t
; (top[320] / bottom[320]), floorclip/ceilingclip and the status bar layout.
; The board is the ESP32-2432S028 "Cheap Yellow Display": a 240x320 ILI9341
; mounted in portrait, rotated a quarter turn to a 320x240 frame, so the
; surface fits natively with two 20 px bars and no scaling at all.
;
; The flags are stated in the panel's portrait axes because
; DisplayConfig::applyRotationNormalization() swaps width/height and the offsets
; for odd rotations: PHYSICAL 200x320 and LOGICAL 200x320 reach the drawer as
; 320x200 at offset (0, 20). The platform header static_asserts the translation.
;
; The engine is pinned by branch, never by a local symlink dependency: the port
; tracks the APU branch work through the demo's own tracker branch
; (docs/plan-doom-esp32.md 4.6). No pull request against develop is opened from
; either tracker branch.

; -----------------------------------------------------------------------------
; native -- the SDL2 simulator. A 320x200 window, 1:1, mirroring the board.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/doom-esp32
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=320
    -D PHYSICAL_DISPLAY_HEIGHT=200
    -D LOGICAL_WIDTH=320
    -D LOGICAL_HEIGHT=200
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) -- uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32dev_ILI9341 -- the primary DOOM target: the CYD, 320x200 at 1:1.
;
; 80 MHz is the clock Phase 0 measured on this panel (D0.1): a 320x200 window
; presents in 13.75 ms in RGB565 against 25.6 ms of theoretical wire time at
; 40 MHz. Do not read the engine's "panels do not run reliably above 40 MHz"
; note as a limit of this panel -- it took 80 MHz for the whole Phase 0 sweep.
;
; PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=20: two DMA line buffers of
; physicalWidth * 2 B * linesPerBlock, so 60 lines at 320 px would cost 76,800 B
; against the 25,600 B the DRAM budget allows.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/doom-esp32
build_flags =
    ${base_esp32.build_flags}
    -D PLATFORM_ESP32DEV_ILI9341
    ; Pre-swap panel axes: 200x320 becomes the 320x200 window after rotation.
    -D PHYSICAL_DISPLAY_WIDTH=200
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D LOGICAL_WIDTH=200
    -D LOGICAL_HEIGHT=320
    ; Pre-swap offsets: this becomes a 20 px bar above and below.
    -D X_OFF_SET=20
    -D Y_OFF_SET=0
    ; TFT config (ILI9341 240x320, rotated to 320x240)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D PIXELROOT32_DRAIN_PRESENT=1
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_palette -- D1.2's palette contract screen. The same panel and
; the same flags as above, plus the one switch that makes DoomScene::draw()
; paint the 256-entry index table and the grey ramp instead of the shell. A
; separate environment on purpose: the shipped build above carries no test
; code, and flashing this one is the visual check for the palette layer.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_palette]
extends = env:esp32dev_ILI9341
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_PALETTE_TEST=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_perf -- D1.4's frame-pacing harness.
;
; The shipped CYD build plus the one switch that turns DoomScene's frame
; recorder on. The recorder writes one `FRAME,...` CSV line per completed frame
; through the same USB/UART the shell used, and the SHELL, TIC and INPUT lines
; are compiled out so the stream is pure CSV. The first line belongs to frame
; 0 and is written at the top of frame 1: a frame is bounded by the next
; frame's start sample, so the final frame of a run has no line.
;
; This environment is a measurement build, not a shipping one: it adds an
; end-of-draw micros() sample, a heap read and a ~98-byte serial line per
; frame. The header of src/perf/FrameLog.h states exactly what each field
; includes and what it cannot separate.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_perf]
extends = env:esp32dev_ILI9341
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_FRAME_LOG=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_wad -- D2.3's container probe: the storage chain on hardware.
;
; The shipped CYD build plus two switches and nothing else:
;
;  - board_build.partitions selects this project's own partitions_wad.csv, the
;    layout D0.5 measured: 24 KB nvs, a 1984 KB app slot at 0x10000 and a 2 MB
;    `wad` data partition at 0x200000. The bench keeps its own copy of the same
;    rows; this project must not read across directories for a build input.
;  - PIXELROOT32_DOOM_WAD_PROBE makes DoomScene::init() open that partition
;    through src/doomc/WhdSource.h and print the `WAD,...` and `LUMP,...` lines.
;  - PIXELROOT32_DOOM_ZONE_PROBE makes init() build the zone allocator over a
;    static 64 KB array and print the one `ZONE,...` smoke line. It shares this
;    environment because the same boot log answers both questions: how the
;    container resolves, and that a 64 KB zone refuses the container's 68,168 B
;    HELP1 lump cleanly instead of the cap being raised for it.
;
; The shipped environment above is untouched on purpose: it has to keep
; flashing the default layout, where the probe would only ever report
; partition_missing. Here, the image on the board is the app *and* the container
; written to 0x200000; without the container the partition holds erased flash
; and the probe reports container rejection instead of a lump count.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_wad]
extends = env:esp32dev_ILI9341
board_build.partitions = partitions_wad.csv
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_WAD_PROBE=1
    -D PIXELROOT32_DOOM_ZONE_PROBE=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_flashprof -- D2.5's flash-read profile: what one cold decode
; of E1M1's working set costs, and what the warm repeat costs.
;
; The shipped CYD build plus one switch, on the same partition layout as `_wad`
; above (this project's partitions_wad.csv, so the 2 MB `wad` data partition is
; at 0x200000 and the container can be there). The `_wad` and the shipped
; environments are untouched on purpose: this is a measurement build, not a new
; default.
;
; PIXELROOT32_DOOM_FLASH_PROFILE makes DoomScene::init() run one probe
; (src/doomc/FlashProfile.*) before the shell comes up. It opens the container,
; builds E1M1's working set from the container itself -- the eleven map lumps,
; TEXTURE1, PNAMES, the 66 patch lumps its textures name and the 22 flats its
; sectors name -- decodes all of it into one static buffer, replays the identical
; sequence warm, and prints:
;
;   WADPROF,probe=open,...            the container, and `buf=68168`, the probe's
;                                     static decode buffer, which is what this
;                                     environment costs in RAM
;   WADPROF,pass=cold,phase=...       a summary and one line per phase (map,
;                                     texdir, patches, flats), then the same warm
;   WADPROF,workingset,...            what the plan contains and what did not
;                                     resolve
;   WADPROF,ratio,...                 warm in thousandths of cold: the number
;                                     that says cache-per-lump or stream
;   WADPROF,budget,...                the cold total as tenths of a percent of
;                                     one 28.57 ms frame
;
; It needs the container at 0x200000. Without it the probe reports
; `WADPROF,probe=open,status=fail,code=3` (partition missing) or code 5 (erased
; flash where a container should be), exactly as the `_wad` probe does.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_flashprof]
extends = env:esp32dev_ILI9341
board_build.partitions = partitions_wad.csv
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_FLASH_PROFILE=1

; -----------------------------------------------------------------------------
; clock_test -- host-only unit tests for src/time/, the 35 Hz tic clock.
;
; The clock layer is deliberately engine-free and Arduino-free: integer
; arithmetic over a caller-supplied microsecond sample, no display, no SDL2.
; So this environment installs no library dependency at all and compiles
; src/time/ alone, which also proves the layer never grew a dependency on the
; engine or on the platform headers. The properties DOOM's simulation depends
; on -- exact derivation, exact derivation under jitter, a forward jump, the
; 32-bit micros() wrap, an unchanged sample, an out-of-order sample and the
; fractional position -- are asserted against the definition
; `t * 35 / 1000000`, never against the implementation's own state.
; -----------------------------------------------------------------------------
[env:clock_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; The clock translation unit is built with the same -fno-exceptions switch as
; the firmware. -fno-rtti is not repeated here: PlatformIO hands build_src_flags
; to the test framework's C sources too, where GCC can only warn about it. Every
; firmware environment compiles TicClock.cpp and DoomScene.cpp with both
; switches from lib/platformio.ini `[base]`, which is the build that ships.
build_src_flags =
    -fno-exceptions
build_src_filter = +<time/>
test_filter = unit/test_ticclock*

; -----------------------------------------------------------------------------
; frame_log_test -- host-only unit tests for src/perf/, the frame recorder.
;
; The recorder is deliberately engine-free and Arduino-free: fixed buffers,
; integer arithmetic and a caller-supplied sink, no display, no SDL2. This
; environment therefore installs no library dependency at all and compiles
; src/perf/ and src/time/ alone, which also proves the layer never grew a
; dependency on the engine or on the platform headers.
;
; The tests pin the exact CSV line, a zero-length frame, unsigned tic and heap
; fields, the saturating `present = period - render` remainder across the
; micros() wrap, one line per closed frame, and the no-op close of a frame that
; was never opened.
; -----------------------------------------------------------------------------
[env:frame_log_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -D PIXELROOT32_DOOM_FRAME_LOG=1
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to
; the test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<perf/> +<time/>
test_filter = unit/test_framelog*

; -----------------------------------------------------------------------------
; link_test -- host-only tests for the C <-> C++ seam (D1.5).
;
; The DOOM core is C and lives in lib/doom/; the bridge that lets it call the
; C++ engine lives in src/doomc/. This environment compiles both and calls the
; seam from a host test, so the boundary is exercised by tests and not only by
; a build: every symbol the C header declares is called at least once, so a
; declaration without a definition fails to link here.
;
; Two deliberate properties:
;
;  - No library dependency at all. src/doomc/DoomConsole.cpp reaches the
;    engine's platformPrint through the engine header; with `lib_deps` empty
;    that header is not on the include path, so the bridge takes its stdio
;    fallback. That is what proves the seam never grew a dependency on the
;    engine, and it keeps this environment fast and hardware-free.
;  - lib/doom/ is compiled by the C compiler, not by the C++. PlatformIO routes
;    `-std=gnu++17` to the C++ compile and hands the C source the platform's own
;    C standard, so the C file is built as C here exactly as it is for the
;    firmware. `-fno-rtti` is not added for the same reason the sibling
;    environments omit it: it is a C++ switch and GCC can only warn about it
;    when the flag list reaches a C source.
;
; `palette/` is in build_src_filter because the bridge calls
; doom::palette::indexTable() -- a real symbol this port owns -- and the test
; build has to contain it. The palette layer is engine-free by design.
; -----------------------------------------------------------------------------
[env:link_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/> +<palette/>
test_filter = unit/test_link*

; -----------------------------------------------------------------------------
; wad_test -- host-only tests for the WAD directory reader (D2.1).
;
; The reader is deliberately blind to where its bytes come from: it takes a
; caller-supplied buffer, so this environment builds synthetic WADs in memory
; and needs no filesystem, no flash and no doom1.wad. lib/doom/ is a project
; library and env:link_test already proves PlatformIO routes its `.c` file to
; the C compiler; this environment includes w_wad.h from the test, so the
; library is found and w_wad.c is built as C exactly as the firmware builds it.
;
; There is no build_src_filter and no `test_build_src`: src/ has nothing to do
; with the reader, and leaving it out keeps the environment as small as the
; clock and frame-log suites. The device adapter in src/doomc/ is exercised by
; env:link_test (host stub) and by the firmware build (real mmap path).
; -----------------------------------------------------------------------------
[env:wad_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_wad*

; -----------------------------------------------------------------------------
; whd_test -- host-only tests for the compressed container reader (D2.2).
;
; Same shape as wad_test and for the same reason: the reader takes a
; caller-supplied buffer and knows nothing about flash, files or the engine, so
; the tests build containers byte for byte in memory. The DEFLATE payloads are
; written by a bit writer in the test file itself -- stored, fixed-Huffman and
; dynamic-Huffman blocks -- so no binary fixture is committed and the decoder's
; three block paths are all exercised by CI, not only by the local real-WAD run.
;
; No build_src_filter and no test_build_src: src/ has nothing to do with the
; container, and `#include "whd.h"` is what makes PlatformIO build lib/doom/whd.c
; as C, exactly as the firmware builds it.
; -----------------------------------------------------------------------------
[env:whd_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_whd*

; -----------------------------------------------------------------------------
; flashprof_test -- host-only tests for the flash-read profile (D2.5).
;
; The arithmetic of the instrument, not the instrument: a host test folds
; synthetic reads into an accumulator and asserts the exact `WADPROF,...` lines
; the boot log carries. `src/doomc/FlashProfile.cpp` is engine-free and
; Arduino-free by construction, so this environment filters it to that one file
; and installs no library dependency at all.
;
; The flag is absent on purpose. `PIXELROOT32_DOOM_FLASH_PROFILE` is what selects
; the board probe, and the suite's last case is the disabled build: it asserts
; `kFlashProfileEnabled` is false and that the gate the shipped build compiles
; (`FlashProfileReport<false>`) emits nothing. The enabled form is instantiated
; explicitly in the same binary, so both halves of the gate are covered here and
; the probe still never needs flash, a partition or `esp_timer.h`.
; -----------------------------------------------------------------------------
[env:flashprof_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to
; the test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/FlashProfile.cpp>
test_filter = unit/test_flashprof*

; -----------------------------------------------------------------------------
; zone_test -- host-only tests for the zone allocator (D2.3).
;
; The arena is a local array in every case, so the tests need no filesystem, no
; flash and no engine. `#include "z_zone.h"` is what makes PlatformIO build
; lib/doom/z_zone.c with the C compiler, exactly as the firmware builds it; the
; suite then exercises allocation, coalescing, tags, purges, the 68,168 B
; refusal and the accounting identity through the public C API only.
; -----------------------------------------------------------------------------
[env:zone_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_zone*

; -----------------------------------------------------------------------------
; rdat_test -- host-only tests for the picture decoders (D2.4).
;
; Same shape as wad_test, whd_test and zone_test and for the same reason: the
; decoders take buffers and know nothing about flash, files, the container or
; the zone, so every patch, texture directory, PNAMES table and flat the suite
; uses is assembled byte for byte inside the test file. `#include "r_data.h"`
; is what makes PlatformIO build lib/doom/r_data.c with the C compiler, exactly
; as the firmware builds it, and this environment links nothing else from
; lib/doom/, which is what proves the decoders stayed independent of w_wad.c,
; whd.c and z_zone.c.
;
; There is no build_src_filter and no `test_build_src`: src/ has nothing to do
; with decoding a lump.
; -----------------------------------------------------------------------------
[env:rdat_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_rdat*

; -----------------------------------------------------------------------------
; rbsp_test -- host-only tests for the BSP walk (D3.1).
;
; Same shape as wad_test, whd_test, zone_test and rdat_test: every map here is
; assembled byte for byte in the test file, in the 1993 WAD record layout, so
; this environment needs no WAD, no container, no display and no engine.
; `#include "r_bsp.h"` is what makes PlatformIO build lib/doom/r_bsp.c and its
; dependencies with the C compiler, exactly as the firmware builds them.
;
; The tests pin the culling rules and the clip list (a seg outside the frustum,
; behind the viewer, back-facing, and a near wall occluding a far one), the
; near-to-far BSP order, the plane key set, the R_CheckPlane split and widen
; rules, the plane cap, the map loader's index validation, and the spawn
; viewpoint rule.
;
; There is no build_src_filter and no `test_build_src`: src/ has nothing to do
; with the walk.
; -----------------------------------------------------------------------------
[env:rbsp_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_rbsp*
