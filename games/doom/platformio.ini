; PlatformIO config for the DOOM port. default_envs=native builds the SDL2
; simulator; esp32dev_ILI9341 is the shipped board image. The ESP32 platform pin
; (espressif32@7.1.2, declared in lib/platformio.ini) is load-bearing: 3.x does
; not fit.

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; One surface. DOOM renders 320x200 and that number is structural, not a knob:
; SCREENWIDTH sizes distscale[], every visplane_t (top[320]/bottom[320]),
; floorclip/ceilingclip and the status bar layout. The board shows it 1:1 in a
; 320x200 window; the desktop opens a 640x400 window (2x, integer nearest-neighbour).
;
; Target: a classic ESP32 DevKit (`esp32dev`: 240 MHz dual core, 4 MB flash, no
; PSRAM) with a 240x320 ILI9341 panel mounted in portrait and rotated a quarter
; turn to a 320x240 frame, so the surface fits natively with two 20 px bars and
; no scaling at all. Flags are stated in the panel's portrait axes because
; DisplayConfig::applyRotationNormalization() swaps width/height and the offsets
; for odd rotations: PHYSICAL 200x320 and LOGICAL 200x320 reach the drawer as
; 320x200 at offset (0, 20). The platform header static_asserts the translation.
;
; The engine is a released library dependency (^1.14.1), never a local symlink:
; 1.14.1 carries the present path, the 8bpp expansion table, persistence and the
; APU hybrid synthesis this port needs.

; native -- the SDL2 simulator: a 320x200 surface in a 640x400 window (2x,
; integer nearest-neighbour), mirroring the board, and the full profile. It is
; the default environment.
[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.14.1
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=320
    -D PHYSICAL_DISPLAY_HEIGHT=200
    -D LOGICAL_WIDTH=320
    -D LOGICAL_HEIGHT=200
    ; The game frame, its status bar and the menu: the same switches the shipped
    ; esp32dev_ILI9341 image uses. Without PIXELROOT32_DOOM_SHOW_E1M1,
    ; DoomScene::draw() falls back to paintShellFrame and the simulator never
    ; draws the level. DOOM_MENU draws over the HUD, so it needs DOOM_HUD.
    -D PIXELROOT32_DOOM_SHOW_E1M1=1
    -D DOOM_HUD=1
    -D DOOM_MENU=1
    ; The palette flashes and DOOM's sound API, through the engine's native
    ; implementations: SDL2_AudioBackend drives the same ApuCore the board runs
    ; and the desktop expands PLAYPAL through the same table the panel's LUT uses.
    -D DOOM_PALFLASH=1
    -D DOOM_AUDIO=1
    ; DOOM_FULL_PROFILE: the full feature set (per-level music, i.e. the nine
    ; MusE1M1..9.inc themes, the full sprite bake, vanilla's screen melt and twin
    ; index planes). There is no separate profile environment; this `-D` is the
    ; only additive gate, and the 4 MB esp32dev_ILI9341 build keeps its cuts.
    -D DOOM_FULL_PROFILE=1
    ; The full-sprite container native reads by default: every episode sprite
    ; frame, including the 239 the shipped recipe drops because no frame is
    ; reachable (264,819 B stored; keeping them leaves the 4 MB `wad` row with
    ; 25,176 B of spare). Built by
    ; `tools\make_container.ps1 -Out tools\DOOM1-full.whd -FullSprites`, never
    ; flashed, and $DOOM_WHD still overrides it. Native-only: esp32dev_ILI9341
    ; keeps the trimmed tools/DOOM1.whd default.
    -D DOOM_WHD_DEFAULT=\"tools/DOOM1-full.whd\"
    ; The E1M1 sprite fixture (tools/e1m1_sprites.inc): the simulator builds its
    ; sprite list from the same table the board proves.
    -Itools
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; FrameDriver.cpp compiles its driver block for PLATFORM_NATIVE through the
    ; DriverPlatform.h seam: the ESP32 heap census and stack watermark report 0
    ; there, and the TFT_eSPI DMA line-block size is a board fact this
    ; environment guards, so it defines no fake one.
    ; macOS (Homebrew) SDL2 needs -I/opt/homebrew/include and -L/opt/homebrew/lib;
    ; on Windows (MSYS2/MinGW) these instead:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; 40 MHz is the SPI clock this environment sets, but the bench ran this panel at
; 80 MHz: 13.75 ms per 320x200 RGB565 frame against 25.6 ms of theoretical wire
; time at 40 MHz. Do not read the engine's "panels do not run reliably above
; 40 MHz" note as a limit of this panel; it ran at 80 MHz for the whole sweep.
;
; LINES_PER_BLOCK (20, from [base_esp32]): two DMA line buffers of
; physicalWidth * 2 B * linesPerBlock, so 60 lines at 320 px would cost 76,800 B
; against the 25,600 B the DRAM budget allows.
;
; board_build.partitions selects partitions_wad.csv: the 3,375,104 B `wad`
; partition at 0x0C0000 holds the container, above the 720,896 B app row and
; below the 32 KB `saves` row.

; esp32dev_ILI9341 -- the shipped image: the board, 320x200 at 1:1, with the
; game frame, DOOM's status bar, the menu, the palette flashes and the audio.
[env:esp32dev_ILI9341]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.14.1
board_build.partitions = partitions_wad.csv
build_flags =
    ${base_esp32.build_flags}
    -D PLATFORM_ESP32DEV_ILI9341
    ; The 12 KB loop-task stack. The firing path is the deepest chain the game
    ; has: P_AimLineAttack and P_LineAttack each put a 768 B intercept array on
    ; the stack, then the intercept walk and P_SpawnMobj run on top, and at the
    ; framework's 8 KB it overflowed into the zone (LoadProhibited panic or a
    ; silent hang). Measured with the SHOW,stack field: the deepest point uses
    ; 5,380 B of 16,384, and the arena probe still fits its 18,432 B at boot.
    -D ARDUINO_LOOP_STACK_SIZE=12288
    ; Pre-swap panel axes and offsets: PHYSICAL/LOGICAL 200x320 become the
    ; 320x200 window after rotation, i.e. a 20 px bar above and below.
    -D PHYSICAL_DISPLAY_WIDTH=200
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D LOGICAL_WIDTH=200
    -D LOGICAL_HEIGHT=320
    -D X_OFF_SET=20
    -D Y_OFF_SET=0
    ; TFT_eSPI panel facts: ILI9341 240x320 rotated to 320x240 (DISPLAY_ROTATION=3).
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    ; The panel has no touch controller.
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D PIXELROOT32_DRAIN_PRESENT=1
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2
    -D PIXELROOT32_DOOM_SHOW_E1M1=1
    ; -Itools is the E1M1 sprite fixture (`e1m1_sprites.inc`) the native
    ; environment also includes: the board must build the sprite list from the
    ; table the host proves, or its hash describes a different frame.
    -Itools
    ; DOOM_HUD shrinks the 3D view to DOOM's screen size 9 (320x168, centery 84)
    ; and lib/doom/st_stuff.c repaints the bottom 32 rows every frame.
    -D DOOM_HUD=1
    ; DOOM_MENU draws over the HUD, so it needs DOOM_HUD.
    -D DOOM_MENU=1
    -D DOOM_PALFLASH=1
    ; DOOM's S_* layer wired to the APU. A build without DOOM_AUDIO keeps the
    ; silent stubs, so lib/doom still links and carries no voice table.
    -D DOOM_AUDIO=1
    ; The save slots and the settings record over the engine's persistence layer.
    ; PIXELROOT32_ENABLE_PERSISTENCE turns the engine module on (default 0), and
    ; DOOM_PERSISTENCE is the demo's own switch: it guards every include, every
    ; store and every SHOW,persist/save/load line, so a build without it compiles
    ; the persistence code out cleanly, exactly how DOOM_AUDIO is handled.
    -D PIXELROOT32_ENABLE_PERSISTENCE=1
    -D DOOM_PERSISTENCE=1

; clock_test -- host-only unit tests for src/time/, the 35 Hz tic clock. The
; layer is engine-free and Arduino-free, so this environment installs no library
; dependency and compiles src/time/ alone; cases assert the definition
; `t * 35 / 1000000` through the public API.
[env:clock_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only: build_src_flags also reaches the C sources, where
; -fno-rtti would only warn (the firmware gets both from lib/platformio.ini [base]).
build_src_flags =
    -fno-exceptions
build_src_filter = +<time/>
test_filter = unit/test_ticclock*

; frame_log_test -- host-only unit tests for src/perf/, the frame recorder.
; Engine-free like clock_test: no library dependency, and it compiles src/perf/
; and src/time/ alone.
[env:frame_log_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -D PIXELROOT32_DOOM_FRAME_LOG=1
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<perf/> +<time/>
test_filter = unit/test_framelog*

; link_test -- host-only tests for the C <-> C++ seam: every symbol the C header
; declares is called at least once, so a declaration without a definition fails
; to link. No engine dependency: that header is not on the include path, so
; DoomConsole.cpp takes its stdio fallback; lib/doom/ is built as C.
[env:link_test]
platform = native
test_framework = unity
test_build_src = true
; The host stub links every src/doomc object, and the bank carries its ADSR as
; the APU's InstrumentPreset; the header needs the dependency.
lib_deps = gperez88/PixelRoot32-APU@^2.3.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/> +<palette/>
test_filter = unit/test_link*

; wad_test -- host-only tests for the WAD directory reader over caller-supplied
; buffers, so no filesystem, flash or doom1.wad. No test_build_src;
; `#include "w_wad.h"` is what makes PlatformIO build w_wad.c as C.
[env:wad_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_wad*

; wipe_test -- new host-only tests for the vanilla screen melt. Same shape as
; wad_test: the tests build their two screens in memory, and `#include
; "f_wipe.h"` is what makes PlatformIO build lib/doom/f_wipe.c (and the
; m_random.c it calls) as C, exactly as the firmware builds it.
[env:wipe_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_wipe*

; whd_test -- host-only tests for the compressed container reader over in-memory
; containers. The DEFLATE payloads are written by a bit writer in the test file
; (stored, fixed-Huffman and dynamic-Huffman), so all three block paths run in
; CI. `#include "whd.h"` builds lib/doom/whd.c as C; no test_build_src.
[env:whd_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_whd*

; baked_test -- host-only tests for the baked-graphics adapter: containers are
; assembled byte for byte in the test file, and only src/doomc/BakedGraphics.cpp
; is compiled (r_segs.c/r_plane.c are not linked, on purpose). The C referee in
; test_baked/tool/ is compiled by bake_graphics.py with `-x c`, not by
; PlatformIO: its .c.inc extension is not a test source.
[env:baked_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<doomc/BakedGraphics.cpp>
test_filter = unit/test_baked*

; flashprof_test -- host-only tests for the flash-read profile arithmetic: it
; asserts the exact `WADPROF,...` lines the boot log carries, filtering src/ to
; src/doomc/FlashProfile.cpp and installing no library dependency.
; `PIXELROOT32_DOOM_FLASH_PROFILE` is absent on purpose: the suite's last case is
; the disabled build (kFlashProfileEnabled false, FlashProfileReport<false>
; emits nothing), and the enabled form is instantiated explicitly in the same
; binary.
[env:flashprof_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; -fno-exceptions only, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/FlashProfile.cpp>
test_filter = unit/test_flashprof*

; zone_test -- host-only tests for the zone allocator, with the arena a local
; array. `#include "z_zone.h"` builds lib/doom/z_zone.c as C; no test_build_src.
[env:zone_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_zone*

; rdat_test -- host-only tests for the picture decoders, with every patch,
; texture directory, PNAMES table and flat assembled in the test file.
; `#include "r_data.h"` builds lib/doom/r_data.c as C; nothing else from lib/doom/
; is linked, which proves the decoders stay independent of w_wad.c, whd.c and
; z_zone.c. No test_build_src.
[env:rdat_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_rdat*

; rbsp_test -- host-only tests for the BSP walk, with every map assembled in the
; 1993 WAD record layout in the test file. `#include "r_bsp.h"` builds
; lib/doom/r_bsp.c and its dependencies as C; no test_build_src.
[env:rbsp_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
