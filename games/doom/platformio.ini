; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; One surface, one window, 1:1. DOOM renders 320x200 and that number is
; structural, not a knob: SCREENWIDTH sizes distscale[], every visplane_t
; (top[320] / bottom[320]), floorclip/ceilingclip and the status bar layout.
; The board is the ESP32-2432S028 "Cheap Yellow Display": a 240x320 ILI9341
; mounted in portrait, rotated a quarter turn to a 320x240 frame, so the
; surface fits natively with two 20 px bars and no scaling at all.
;
; The flags are stated in the panel's portrait axes because
; DisplayConfig::applyRotationNormalization() swaps width/height and the offsets
; for odd rotations: PHYSICAL 200x320 and LOGICAL 200x320 reach the drawer as
; 320x200 at offset (0, 20). The platform header static_asserts the translation.
;
; The engine is pinned to the released version, never by a local symlink
; dependency: 1.14.0 is what carries the present path, the 8bpp expansion table,
; the persistence module and the APU hybrid-synthesis work this port needs.

; -----------------------------------------------------------------------------
; native -- the SDL2 simulator. A 320x200 window, 1:1, mirroring the board.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.14.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=320
    -D PHYSICAL_DISPLAY_HEIGHT=200
    -D LOGICAL_WIDTH=320
    -D LOGICAL_HEIGHT=200
    ; The game frame, its status bar and the menu, the same switches the
    ; `esp32dev_ILI9341_hud` build uses. Without PIXELROOT32_DOOM_SHOW_E1M1
    ; DoomScene::draw() falls back to paintShellFrame and the simulator never
    ; draws the level. DOOM_MENU draws over the HUD, so it needs DOOM_HUD.
    ; FrameDriver.cpp compiles its driver block for PLATFORM_NATIVE through the
    ; DriverPlatform.h seam; the ESP32 heap census and stack watermark report 0
    ; there, and the TFT_eSPI DMA line-block size is a board fact the scene
    ; guards, so this environment does not define a fake one.
    -D PIXELROOT32_DOOM_SHOW_E1M1=1
    -D DOOM_HUD=1
    -D DOOM_MENU=1
    ; The E1M1 sprite fixture (tools/e1m1_sprites.inc) the frame environments
    ; include, so the host builds the sprite list from the same table as the
    ; board.
    -Itools
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) -- uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32dev_ILI9341 -- the primary DOOM target: the CYD, 320x200 at 1:1.
;
; 80 MHz is the clock the bench measured on this panel (bench/, probe D0.1): a
; 320x200 window
; presents in 13.75 ms in RGB565 against 25.6 ms of theoretical wire time at
; 40 MHz. Do not read the engine's "panels do not run reliably above 40 MHz"
; note as a limit of this panel -- it ran at 80 MHz for the whole bench sweep.
;
; PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=20: two DMA line buffers of
; physicalWidth * 2 B * linesPerBlock, so 60 lines at 320 px would cost 76,800 B
; against the 25,600 B the DRAM budget allows.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.14.0
build_flags =
    ${base_esp32.build_flags}
    -D PLATFORM_ESP32DEV_ILI9341
    ; The loop task's stack. The firing path is the deepest chain the game
    ; has -- P_AimLineAttack and P_LineAttack each put a 768 B intercept array on
    ; the stack, then the intercept walk and P_SpawnMobj run on top -- and at the
    ; framework's 8 KB it overflowed into the zone, which surfaced as a
    ; LoadProhibited panic or a silent hang. Measured with the
    ; SHOW,stack field: the deepest point leaves 11,004 B of 16,384, so the chain
    ; uses 5,380 B. 12 KB leaves 6.9 KB of margin over that, and the loop stack is
    ; allocated at boot, where the heap still has room for it: the arena probe
    ; still fits its 18,432 B (heap_largest_before 19,444 with the 16 KB test).
    -D ARDUINO_LOOP_STACK_SIZE=12288
    ; Pre-swap panel axes: 200x320 becomes the 320x200 window after rotation.
    -D PHYSICAL_DISPLAY_WIDTH=200
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D LOGICAL_WIDTH=200
    -D LOGICAL_HEIGHT=320
    ; Pre-swap offsets: this becomes a 20 px bar above and below.
    -D X_OFF_SET=20
    -D Y_OFF_SET=0
    ; TFT config (ILI9341 240x320, rotated to 320x240)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D PIXELROOT32_DRAIN_PRESENT=1
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_palette -- the palette contract screen. The same panel and
; the same flags as above, plus the one switch that makes DoomScene::draw()
; paint the 256-entry index table and the grey ramp instead of the shell. A
; separate environment on purpose: the shipped build above carries no test
; code, and flashing this one is the visual check for the palette layer.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_palette]
extends = env:esp32dev_ILI9341
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_PALETTE_TEST=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_perf -- the frame-pacing harness.
;
; The shipped CYD build plus the one switch that turns DoomScene's frame
; recorder on. The recorder writes one `FRAME,...` CSV line per completed frame
; through the same USB/UART the shell used, and the SHELL, TIC and INPUT lines
; are compiled out so the stream is pure CSV. The first line belongs to frame
; 0 and is written at the top of frame 1: a frame is bounded by the next
; frame's start sample, so the final frame of a run has no line.
;
; This environment is a measurement build, not a shipping one: it adds an
; end-of-draw micros() sample, a heap read and a ~98-byte serial line per
; frame. The header of src/perf/FrameLog.h states exactly what each field
; includes and what it cannot separate.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_perf]
extends = env:esp32dev_ILI9341
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_FRAME_LOG=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_wad -- the container probe: the storage chain on hardware.
;
; The shipped CYD build plus two switches and nothing else:
;
;  - board_build.partitions selects this project's own partitions_wad.csv:
;    24 KB nvs, a 720,896 B app slot at 0x10000, a 3,375,104 B `wad` data partition at
;    0x0C0000 and the 32 KB `saves` row at 0x3F8000. The container carries all
;    nine shareware levels, so the offset follows the table. The bench keeps
;    its own copy; this project must not read across directories for a build
;    input.
;  - PIXELROOT32_DOOM_WAD_PROBE makes DoomScene::init() open that partition
;    through src/doomc/WhdSource.h and print the `WAD,...` and `LUMP,...` lines.
;  - PIXELROOT32_DOOM_ZONE_PROBE makes init() build the zone allocator over a
;    static 64 KB array and print the one `ZONE,...` smoke line. It shares this
;    environment because the same boot log answers both questions: how the
;    container resolves, and that a 64 KB zone refuses a 68,168 B full-screen
;    lump cleanly instead of the cap being raised for it.
;
; The shipped environment above is untouched on purpose: it has to keep
; flashing the default layout, where the probe would only ever report
; partition_missing. Here, the image on the board is the app *and* the container
; written to 0x0C0000; without the container the partition holds erased flash
; and the probe reports container rejection instead of a lump count.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_wad]
extends = env:esp32dev_ILI9341
board_build.partitions = partitions_wad.csv
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_WAD_PROBE=1
    -D PIXELROOT32_DOOM_ZONE_PROBE=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_flashprof -- the flash-read profile: what one cold decode
; of E1M1's working set costs, and what the warm repeat costs.
;
; The shipped CYD build plus one switch, on the same partition layout as `_wad`
; above (this project's partitions_wad.csv, so the 3,375,104 B `wad` data
; partition is at 0x0C0000 and the container can be there). The `_wad` and the shipped
; environments are untouched on purpose: this is a measurement build, not a new
; default.
;
; PIXELROOT32_DOOM_FLASH_PROFILE makes DoomScene::init() run one probe
; (src/doomc/FlashProfile.*) before the shell comes up. It opens the container,
; builds E1M1's working set from the container itself -- the eleven map lumps,
; TEXTURE1, PNAMES, the 66 patch lumps its textures name and the 22 flats its
; sectors name -- decodes all of it into one static buffer, replays the identical
; sequence warm, and prints:
;
;   WADPROF,probe=open,...            the container, and `buf=68168`, the probe's
;                                     static decode buffer, which is what this
;                                     environment costs in RAM
;   WADPROF,pass=cold,phase=...       a summary and one line per phase (map,
;                                     texdir, patches, flats), then the same warm
;   WADPROF,workingset,...            what the plan contains and what did not
;                                     resolve
;   WADPROF,ratio,...                 warm in thousandths of cold: the number
;                                     that says cache-per-lump or stream
;   WADPROF,budget,...                the cold total as tenths of a percent of
;                                     one 28.57 ms frame
;
; It needs the container at 0x0C0000. Without it the probe reports
; `WADPROF,probe=open,status=fail,code=3` (partition missing) or code 5 (erased
; flash where a container should be), exactly as the `_wad` probe does.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_flashprof]
extends = env:esp32dev_ILI9341
board_build.partitions = partitions_wad.csv
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_FLASH_PROFILE=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_frame -- the frame driver with the residency cache and the
; per-frame attribution.
;
; The shipped CYD build plus the partition table, the probe switch and -O2:
;
;  - board_build.partitions selects partitions_wad.csv, so the 3,375,104 B `wad`
;    data partition is at 0x0C0000 and the container can be read. Same layout as
;    `_wad` and `_flashprof` above; the shipped environment keeps the default table.
;  - PIXELROOT32_DOOM_FRAME_PROBE compiles the driver in
;    (src/doomc/FrameDriver.*) and makes DoomScene::init() run it once at boot.
;    Without the flag the file's board half, every static buffer and the SHA-256
;    live inside the `#if` and the arithmetic is dropped by --gc-sections, so no
;    FrameDriver symbol reaches the shipped ELF.
;  - -O2, with -Os removed for this environment only. The framework appends its
;    own -Os after build_flags, so -O2 alone loses the last-flag-wins race. This
;    is a measurement build: the shipped environment keeps its flags.
;
; What it prints, one line each: `FRAMEPROF,setup,...` (the arena and the decoded
; directories), `FRAMEPROF,mem,...` (every buffer's size, from sizeof, the cache
; capacity and the heap before/after), then for each of the 20 views and two
; measured runs `FRAMEPROF,frame=NN,run=R,...` with the four pass times, the
; decode share, the counts and the SHA-256 of the index surface, a
; `FRAMEPROF,attr,...` line with the denominators (pixels, columns, fragments),
; the exclusive decode/compose/lookup buckets and the cache hit/miss counts,
; a `FRAMEPROF,breakdown,...` line for views 00, 06, 10 and 16,
; `FRAMEPROF,summary,...` with the means, the residency per-mille and the
; `gate=pass|fail` verdict against 20,000 us, `FRAMEPROF,attrsum,...` with the
; per-unit costs and hit rates, and `FRAMEPROF,probe,...` with the total time and
; the shared-scratch hazard count.
;
; The cache is caller-owned and lives in src/doomc/, not lib/doom/: the library
; still takes a resolver. A cold run warms it; runs 2 and 3 of each view are the
; steady state the table reports.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_frame]
extends = env:esp32dev_ILI9341
board_build.partitions = partitions_wad.csv
; The raster passes are measured at -O2. The framework appends its own -Os
; after every build_flags line, so -O2 alone loses; removing -Os from this one
; environment is what lets the later flag win. Nothing here is a shared section:
; the shipped environment keeps its flags, and so does every other build.
build_unflags =
    ${base_esp32.build_unflags}
    -Os
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_FRAME_PROBE=1
    -Itools
    -O2
    ; Cycle attribution. It only exists in this measurement environment:
    ; the four passes compile their instrumentation out everywhere else, and the
    ; shipped `esp32dev_ILI9341` build keeps exactly the flags it had.
    -D PIXELROOT32_DOOM_RASTER_PROBE=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_frameram -- the A/B control: the same frame driver with the
; map decoded into RAM instead of read from the container's raw section.
;
; The identical environment plus one switch, PIXELROOT32_DOOM_MAP_IN_RAM=1, which
; is the only difference between the two builds. Both render the same four phases
; from the same container, so their frame hashes must agree character for
; character; the numbers that differ are `walk_us` and `frame_us`, and that
; difference is what one flash-resident map costs. `FRAMEPROF,mem` prints
; `map=ram,map_in_ram=1,level_ram=<bytes>` so a captured log says which build it
; came from without being trusted to.
;
; It is the control, not a candidate: it spends the 46,508 B of map DRAM the
; flash-resident map saves, which on this image is the difference between fitting the
; scratch and not.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_frameram]
extends = env:esp32dev_ILI9341_frame
build_flags =
    ${env:esp32dev_ILI9341_frame.build_flags}
    -D PIXELROOT32_DOOM_MAP_IN_RAM=1
    ; This control renders only the 20 sampled views, so it compiles the
    ; sampled capacity set (64 drawsegs, 40 planes, a 5,120-entry clip pool)
    ; instead of the walkable set. The flag names the operation, not the board:
    ; `dram0_0_seg` has 256 B here and the walkable set needs 15,424 B. The 20
    ; views' measured peaks are 39 drawsegs, 22 allocated planes and ~4,160
    ; clip-pool entries, so this set keeps the A/B rendering the same frames.
    -D PIXELROOT32_DOOM_SAMPLED_VIEW_CAPACITIES=1
    ; The control needs ~6 KB more heap than the flash build and the 20-line DMA
    ; block is 25,600 B of it, for a path this probe never uses: it renders
    ; into the engine's 8bpp surface and never presents. Halving it to 10 lines
    ; frees 12,800 B, which is what lets the decoded map fit at all -- without it
    ; the setup stops at NODES (FRAMEPROF,setup,reason=lump,fail_lump=NODES,
    ; heap=8476,largest=2676). The flag is local to this measurement environment,
    ; it comes after base_esp32's 20 so it wins, and every shipped environment
    ; keeps 20.
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=10

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_frame_e1m2 -- the level-selection proof: the same frame
; driver and the same 20 views, opened on E1M2 instead of E1M1.
;
; The union bake's largest level is E1M2 (874,884 B of raw graphics), and it is
; the second-hardest case after E1M1: 243 sprite records against 129. Rendering
; it proves the container's level selection is not a name the driver only
; happens to spell right for the first map. The flag exists only here; every
; other environment compiles the default E1M1.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_frame_e1m2]
extends = env:esp32dev_ILI9341_frame
build_flags =
    ${env:esp32dev_ILI9341_frame.build_flags}
    -D PIXELROOT32_DOOM_FRAME_LEVEL=2

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_show -- the game frame on the panel.
;
; The shipped CYD build plus the partition table, the one switch that replaces
; the shell with E1M1's spawn viewpoint, and the fixture include path:
;
;  - board_build.partitions selects partitions_wad.csv, the same 3,375,104 B
;    `wad` partition at 0x0C0000 the `_wad`, `_flashprof` and `_frame`
;    environments use. The shipped environment above keeps the default table.
;  - PIXELROOT32_DOOM_SHOW_E1M1 makes DoomScene::draw() render the level instead
;    of the four markers: one call into src/doomc/SceneRenderer.h, which opens the
;    container once in init(), renders the host harness's frame 00 every frame
;    into the engine's 8bpp surface, converts that surface in place from DOOM
;    palette indices to RGB332, and lets the engine present it. It also compiles
;    the level session in src/doomc/FrameDriver.cpp -- the same setup the frame
;    probe uses -- so the two cannot diverge.
;  - -Itools is the E1M1 sprite fixture (`e1m1_sprites.inc`) the frame environment
;    also includes: the board builds the sprite list from the table the host
;    proves, or its hash describes a different frame.
;
; What it prints: `SHOW,setup,...` and `SHOW,mem,...` once at boot, then one
; `SHOW,frame=...,render_us=...,convert_us=...,present_us=...,frame_us=...,
; fps_x10=...,update_us=...,hash_us=...,other_us=...,hash=...` line for the first
; 10 frames and once per second after that, up to frame 600; drawing continues
; after reporting stops. The hash is the SHA-256 of the index surface *before*
; conversion, the same number the host's `SPRSTAT ... framehash` prints for
; frame 00. present_us is measured from the scene: the gap between the end of
; draw() and the next update(), which is where the engine's present runs.
;
; This is a product build, not a measurement-only one: nothing here is compiled
; into the shipped environment, whose shell frame is untouched.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_show]
extends = env:esp32dev_ILI9341
board_build.partitions = partitions_wad.csv
build_flags =
    ${env:esp32dev_ILI9341.build_flags}
    -D PIXELROOT32_DOOM_SHOW_E1M1=1
    -Itools

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud -- the game frame with DOOM's status bar.
;
; `_show` plus one switch, DOOM_HUD. It does two things: lib/doom renders a
; 320x168 view (R_VIEW_HEIGHT 168, centery 84, DOOM's screen size 9) and
; src/doomc/FrameDriver.cpp repaints the bottom 32 rows with lib/doom/st_stuff.c
; after every frame, from the player the world already owns. `_show` is left
; as it was on purpose: it is the 200-row view whose frame-00 hash is `50fb3d9c`,
; the number the host gates pin. The HUD frame has its own hash (printed by
; `SHOW,frame00` and `SHOW,hud`); no host gate pins it.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud]
extends = env:esp32dev_ILI9341_show
build_flags =
    ${env:esp32dev_ILI9341_show.build_flags}
    -D DOOM_HUD=1
    -D DOOM_MENU=1
    -D DOOM_PALFLASH=1
    ; DOOM's S_* layer wired to the APU. Every environment that
    ; extends this one inherits it; `_show` (the 200-row view) does not, so its
    ; proven frame path carries no sound call and no voice table.
    -D DOOM_AUDIO=1
    ; The save slots and the settings record over the engine's
    ; persistence layer. `PIXELROOT32_ENABLE_PERSISTENCE` turns the engine module
    ; on (default 0), and DOOM_PERSISTENCE is the demo's own switch: it guards
    ; every include, every store and every `SHOW,persist`/`SHOW,save`/
    ; `SHOW,load` line, so a build without it compiles the persistence code out
    ; cleanly and prints none of them -- exactly how DOOM_AUDIO is handled. Both
    ; flags are on `_hud` only, and every environment that extends it inherits
    ; them; `_show` and the probe environments keep them off.
    -D PIXELROOT32_ENABLE_PERSISTENCE=1
    -D DOOM_PERSISTENCE=1

; -----------------------------------------------------------------------------
; DOOM_PALFLASH is on in the shipped HUD build: ST_doPaletteStuff's
; damage (red), pickup (gold) and radiation-suit (green) flashes. Once per rendered
; frame the scene asks the world which of PLAYPAL's 14 pages the player's counters
; call for and re-applies the palette only when the page changes; a flash page is
; decoded from the container for the duration of that one call (nothing is held in
; RAM between switches). It needs DOOM_MENU: the gamma it composes with is the
; menu's setting.
;
; esp32dev_ILI9341_hud_palflashtest -- the same image plus DOOM_PALFLASH_SCRIPT: a
; fixed script plays a damage, a health-bonus pickup, a second damage and a
; radiation-suit pickup into the real player state (P_DamageMobj,
; P_TouchSpecialThing) at frames 60/140/220/300 and prints every palette switch
; with its cost (`SHOW,palette,...`). Never the shipped image.
;
; esp32dev_ILI9341_hud_nopalflash -- the A/B build with the feature compiled out of
; the scene and the driver, to separate its cost from flash-layout noise.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_palflashtest]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_PALFLASH_SCRIPT=1

[env:esp32dev_ILI9341_hud_nopalflash]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -UDOOM_PALFLASH

; -----------------------------------------------------------------------------
; DOOM_MENU is on in the shipped HUD build: the menu, the setup-lite
; screen and the settings in NVS. LEFT+RIGHT held together opens it; see the README
; for the buttons. The non-HUD `_show` build has no menu. Two things come with the
; flag: the world's arena is sized at nightmare (a harder skill spawns more things
; and New Game can ask for any of them), and the hud cache is emptied when the menu
; opens or closes.
;
; esp32dev_ILI9341_hud_menutest -- the same image plus DOOM_MENU_SCRIPT: a fixed
; input script (open the menu, drive the four settings -- skill, volume, gamma,
; mute -- through their ends, save, start a new game at every skill) played into
; the real button path, because the board's buttons cannot be pressed from the
; build host. It exists to prove on the device what the host gates cannot (NVS
; write and read-back, the audio level the stored volume produces, the reload on
; the real heap, the frame rate with the menu open). Never the shipped image.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_menutest]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_MENU_SCRIPT=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_savetest -- the save record's codec proof.
;
; The shipped HUD build plus DOOM_SAVE_TEST. At boot, once the level is open, it
; writes the live world into slot 5 through the engine's `saveRecord()` (the
; same envelope a menu save uses), then writes the encoded record back to slot 4
; with one payload byte flipped in RAM and the slot store's raw `write()`, so the
; stored CRC no longer covers the payload. It then reads both back and prints
;
;   SHOW,savetest,valid=ok,corrupt=corrupt
;
; with the engine's own `StoreResult` names. This is the one thing no host gate
; can prove: that the CRC the engine installed on the board rejects a corrupted
; record on the board. Slots 4 and 5 are used so the power-cycle record in slot
; 0 is never touched. A diagnostic, never the shipped image.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_savetest]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_SAVE_TEST=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_mapcheck -- the automap's board proof.
;
; The shipped HUD build plus DOOM_MAP_SCRIPT: a fixed input script presses Select
; (the script's own bit, masked out of what the world sees), holds the d-pad to
; pan, A and B to zoom, closes the map, walks forward so more lines are marked,
; and opens it again -- because no button on this board can be pressed from the
; build host. While the map is up every reported frame prints
; `SHOW,map,us=...,follow=...,scale=...,grid=...,hash=...`, whose hash is the
; 320x168 window `tools/am_check.py` prints for the same state. A diagnostic,
; never the shipped image.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_mapcheck]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_MAP_SCRIPT=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_leveltest -- the level transition's board proof.
;
; The shipped HUD build plus DOOM_LEVEL_TEST. At frame 20 the driver finds E1M1's
; own exit switch (line special 11), stands the avatar on the front sector's side
; facing it and prints `SHOW,level,script=stand,...`; from frame 24 B (the world's
; USE) is held for three frames, so the press reaches P_UseSpecialLine through
; P_PlayerThink -> p_use_lines like a real button. The transition then prints
;
;   SHOW,level,from=E1M1,to=E1M2,skill=3,tics=..,health=..,ammo=..
;
; and the fade that the level load starts prints its own `SHOW,fade,steps=8,...`.
; The image is a diagnostic, never the shipped one: the script and its lines are
; entirely inside the flag.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_leveltest]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_LEVEL_TEST=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_dump -- one frame, byte for byte, over the console.
;
; The shipped HUD build plus DOOM_FRAME_DUMP. Holding A and B together for one
; frame writes the finished 320x200 surface as run-length pairs:
;
;   DUMP,begin,frame=N,w=320,h=200
;   DUMP,view,x=..,y=..,z=..,angle=..,dark=<palette page>
;   DUMP,runs=N
;   DUMP,r,<count><value>...    (two hex bytes per pair, 24 pairs a line)
;   DUMP,end
;
; It exists because a refused frame, a wrong flash page and a bad colormap row
; all photograph as "glitches", and the host renderer cannot reproduce a board
; only artifact. The dump is the frame the panel expanded, so the host rebuilds
; it with the same PLAYPAL and diffs it against its own render of the same
; x/y/z/angle. Diagnostic only; never in the shipped image.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_dump]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_FRAME_DUMP=1
    ; The dump runs the stack the shipped image ships, so a dump is
    ; captured under the configuration under test rather than under a bigger
    ; one. The 12 KB comes from esp32dev_ILI9341's build flags.

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_show_dump -- the same dump on the 200-row view.
;
; `_show` renders all 200 rows (no status bar) and its own frame-00 hash is
; `50fb3d9c`; `_hud` renders 168 rows and the bar. A bug that lives in the
; 168-vs-200 row difference would not show on `_hud` at all. This image is
; `_show` plus the dump, so the frame that looks wrong is captured on the exact
; render path that produced it. Diagnostic only; never shipped.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_show_dump]
extends = env:esp32dev_ILI9341_show
build_flags =
    ${env:esp32dev_ILI9341_show.build_flags}
    -D DOOM_FRAME_DUMP=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_levelwalk -- the whole episode, on the panel.
;
; The leveltest image proves one transition; this one walks the route a player
; takes: E1M1 -> E1M2 -> E1M3 -> E1M9 (E1M3's secret line 51) -> E1M4 -> E1M5
; -> E1M6 -> E1M7 -> E1M8 -> the ending. Each level gets ~3 s, then the fixture
; stands on its own exit and B (the world's USE) is held for three frames through
; P_PlayerThink -> p_use_lines; E1M8 takes the victory branch. Frame-paced on
; purpose: it is a viewing aid, not a timing measurement. Diagnostic only; never
; the shipped image.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_levelwalk]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_LEVEL_TEST=1
    -D DOOM_LEVEL_WALK=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_audiotest -- the sound layer's board proof.
;
; The shipped HUD build plus DOOM_AUDIO_SCRIPT: at boot a fixed twelve-cue
; script (pistol, shotgun, door open, door close, switch, lift, imp sight,
; player pain, item pickup, teleport, barrel explosion, player death) is played
; one cue every 700 ms through the real S_StartSound path, and each successful
; play prints `SHOW,audio,play,id=...,name=...,voice=...,vol=...,pitch=...`.
; It exists so a developer can listen to the mapping; it is a diagnostic,
; never the shipped image.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_audiotest]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_AUDIO_SCRIPT=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_soak -- the ten-minute audio soak.
;
; The shipped HUD build plus DOOM_AUDIO_SOAK: E1M1 plays from level load
; and every four tics the scene submits all four longest one-shots (barexp,
; telept, rlaunc, pldeth) from four distinct S_SectorOrigin() tokens, so the
; APU renders four sequencer tracks plus four SFX voices continuously. Once a
; minute it prints
;
;   SHOW,audio,soak,t=60,plays=..,steals=..,refused=..,active=..,
;   underruns=..,worst_us=..,fps_x10=..
;
; and after ten minutes
;
;   SHOW,audio,soak,end,minutes=10,underruns=..,worst_us=..,plays=..,
;   steals=..,refused=..,resets=0
;   SHOW,audio,soak,budget,block_us=5804,worst_us=..,pct_x10=..
;
; The number that matters is `underruns`: 0 over the whole run means the render
; task never missed a DMA block with the APU fully loaded. `worst_us` is the
; worst render of one block; `pct_x10` puts it against the 5.80 ms 128-sample
; block (the engine's own render block is 512 samples).
;
; It is a diagnostic, never the shipped image: the script, its counters and its
; lines live entirely inside the flag, so esp32dev_ILI9341_hud carries none of
; it and keeps its flash headroom and frame rate.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_soak]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_AUDIO_SOAK=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_nofaces -- the CYD fall-back bar.
;
; The bar without the face widget (STBAR's empty face box stays). Kept behind
; its own environment so the bar can be measured both ways; the full
; bar stays the default for the S3 profile.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_nofaces]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_HUD_NOFACES=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_noweapon -- the A/B build that isolates the weapon's cost.
;
; The full HUD build without the player-sprite call. It exists to answer
; "what does R_DrawPlayerSprites cost on the CYD" against the same bar and view;
; it is a measurement environment, never what ships.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_noweapon]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_HUD_NOWEAPON=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_weaponcheck -- the weapon's board-vs-host proof.
;
; The full HUD build plus DOOM_WEAPON_DIAG: once, when the pistol rests, the
; firmware prints SHA-256 hashes of a box around it before and after it is drawn
; (`SHOW,weaponparts`), which tools/weapon_draw_check.py --board-rect rebuilds on
; the host. A separate environment because the extra code moves the flash layout
; and the frame time with it; the shipped HUD build carries none of it.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_weaponcheck]
extends = env:esp32dev_ILI9341_hud
build_flags =
    ${env:esp32dev_ILI9341_hud.build_flags}
    -D DOOM_WEAPON_DIAG=1

; -----------------------------------------------------------------------------
; esp32dev_ILI9341_hud_nowad -- the missing-partition screen's board proof.
;
; The shipped HUD build over partitions_nowad.csv, a table with no `wad` row.
; It exists for one capture: the level open fails at esp_partition_find_first()
; with DOOM_WHD_SOURCE_ERR_PARTITION_MISSING (3) and the panel paints
; "NO WAD SLOT", which cannot be reached with partitions_wad.csv because that
; table always has the partition. The serial prints both
; `SHOW,setup,status=fail,reason=open,code=3` and
; `SHOW,boot,screen=error,reason=partition_missing,code=3,detail=`.
;
; A diagnostic, never the shipped image: same sources, a different partition
; table, so the shipped image keeps its size, its flash headroom and its
; frame-00 hash. `partitions_nowad.csv` carries the table's own reasoning.
; -----------------------------------------------------------------------------
[env:esp32dev_ILI9341_hud_nowad]
extends = env:esp32dev_ILI9341_hud
board_build.partitions = partitions_nowad.csv

; -----------------------------------------------------------------------------
; clock_test -- host-only unit tests for src/time/, the 35 Hz tic clock.
;
; The clock layer is deliberately engine-free and Arduino-free: integer
; arithmetic over a caller-supplied microsecond sample, no display, no SDL2.
; So this environment installs no library dependency at all and compiles
; src/time/ alone, which also proves the layer never grew a dependency on the
; engine or on the platform headers. The properties DOOM's simulation depends
; on -- exact derivation, exact derivation under jitter, a forward jump, the
; 32-bit micros() wrap, an unchanged sample, an out-of-order sample and the
; fractional position -- are asserted against the definition
; `t * 35 / 1000000`, never against the implementation's own state.
; -----------------------------------------------------------------------------
[env:clock_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; The clock translation unit is built with the same -fno-exceptions switch as
; the firmware. -fno-rtti is not repeated here: PlatformIO hands build_src_flags
; to the test framework's C sources too, where GCC can only warn about it. Every
; firmware environment compiles TicClock.cpp and DoomScene.cpp with both
; switches from lib/platformio.ini `[base]`, which is the build that ships.
build_src_flags =
    -fno-exceptions
build_src_filter = +<time/>
test_filter = unit/test_ticclock*

; -----------------------------------------------------------------------------
; frame_log_test -- host-only unit tests for src/perf/, the frame recorder.
;
; The recorder is deliberately engine-free and Arduino-free: fixed buffers,
; integer arithmetic and a caller-supplied sink, no display, no SDL2. This
; environment therefore installs no library dependency at all and compiles
; src/perf/ and src/time/ alone, which also proves the layer never grew a
; dependency on the engine or on the platform headers.
;
; The tests pin the exact CSV line, a zero-length frame, unsigned tic and heap
; fields, the saturating `present = period - render` remainder across the
; micros() wrap, one line per closed frame, and the no-op close of a frame that
; was never opened.
; -----------------------------------------------------------------------------
[env:frame_log_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -D PIXELROOT32_DOOM_FRAME_LOG=1
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to
; the test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<perf/> +<time/>
test_filter = unit/test_framelog*

; -----------------------------------------------------------------------------
; link_test -- host-only tests for the C <-> C++ seam.
;
; The DOOM core is C and lives in lib/doom/; the bridge that lets it call the
; C++ engine lives in src/doomc/. This environment compiles both and calls the
; seam from a host test, so the boundary is exercised by tests and not only by
; a build: every symbol the C header declares is called at least once, so a
; declaration without a definition fails to link here.
;
; Two deliberate properties:
;
;  - No library dependency at all. src/doomc/DoomConsole.cpp reaches the
;    engine's platformPrint through the engine header; with `lib_deps` empty
;    that header is not on the include path, so the bridge takes its stdio
;    fallback. That is what proves the seam never grew a dependency on the
;    engine, and it keeps this environment fast and hardware-free.
;  - lib/doom/ is compiled by the C compiler, not by the C++. PlatformIO routes
;    `-std=gnu++17` to the C++ compile and hands the C source the platform's own
;    C standard, so the C file is built as C here exactly as it is for the
;    firmware. `-fno-rtti` is not added for the same reason the sibling
;    environments omit it: it is a C++ switch and GCC can only warn about it
;    when the flag list reaches a C source.
;
; `palette/` is in build_src_filter because the bridge calls
; doom::palette::indexTable() -- a real symbol this port owns -- and the test
; build has to contain it. The palette layer is engine-free by design.
; -----------------------------------------------------------------------------
[env:link_test]
platform = native
test_framework = unity
test_build_src = true
; The host stub links every src/doomc object, and the bank carries its
; ADSR as the APU's InstrumentPreset; the header needs the dependency.
lib_deps = gperez88/PixelRoot32-APU@^2.0.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/> +<palette/>
test_filter = unit/test_link*

; -----------------------------------------------------------------------------
; wad_test -- host-only tests for the WAD directory reader.
;
; The reader is deliberately blind to where its bytes come from: it takes a
; caller-supplied buffer, so this environment builds synthetic WADs in memory
; and needs no filesystem, no flash and no doom1.wad. lib/doom/ is a project
; library and env:link_test already proves PlatformIO routes its `.c` file to
; the C compiler; this environment includes w_wad.h from the test, so the
; library is found and w_wad.c is built as C exactly as the firmware builds it.
;
; There is no build_src_filter and no `test_build_src`: src/ has nothing to do
; with the reader, and leaving it out keeps the environment as small as the
; clock and frame-log suites. The device adapter in src/doomc/ is exercised by
; env:link_test (host stub) and by the firmware build (real mmap path).
; -----------------------------------------------------------------------------
[env:wad_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_wad*

; -----------------------------------------------------------------------------
; whd_test -- host-only tests for the compressed container reader.
;
; Same shape as wad_test and for the same reason: the reader takes a
; caller-supplied buffer and knows nothing about flash, files or the engine, so
; the tests build containers byte for byte in memory. The DEFLATE payloads are
; written by a bit writer in the test file itself -- stored, fixed-Huffman and
; dynamic-Huffman blocks -- so no binary fixture is committed and the decoder's
; three block paths are all exercised by CI, not only by the local real-WAD run.
;
; No build_src_filter and no test_build_src: src/ has nothing to do with the
; container, and `#include "whd.h"` is what makes PlatformIO build lib/doom/whd.c
; as C, exactly as the firmware builds it.
; -----------------------------------------------------------------------------
[env:whd_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_whd*

; -----------------------------------------------------------------------------
; baked_test -- host-only tests for the baked-graphics adapter.
;
; The adapter is engine-free and Arduino-free by construction: it reads a
; caller-owned container through lib/doom/whd.c and returns renderer records.
; Every container here is assembled byte for byte in the test file, so the suite
; needs no WAD, no flash, no display and no engine. `src/doomc/BakedGraphics.cpp`
; is compiled by build_src_filter; `r_segs.c` and `r_plane.c` are not linked,
; which is the point: the adapter only needs their header contracts.
;
; The manifest cases pin the valid form, a truncated lump, wrong magic, a
; duplicate name, an index outside the container, an unknown kind, a bad shape
; and a non-raw payload. The derivation cases pin widthMask, heightMask == 127,
; the mask pointer present/absent, and the 4,096-byte flat shape. The tool in
; test_baked/tool/ is the C referee and is compiled by bake_graphics.py with
; `-x c`, not by PlatformIO: its .c.inc extension is not a test source.
; -----------------------------------------------------------------------------
[env:baked_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<doomc/BakedGraphics.cpp>
test_filter = unit/test_baked*

; -----------------------------------------------------------------------------
; flashprof_test -- host-only tests for the flash-read profile.
;
; The arithmetic of the instrument, not the instrument: a host test folds
; synthetic reads into an accumulator and asserts the exact `WADPROF,...` lines
; the boot log carries. `src/doomc/FlashProfile.cpp` is engine-free and
; Arduino-free by construction, so this environment filters it to that one file
; and installs no library dependency at all.
;
; The flag is absent on purpose. `PIXELROOT32_DOOM_FLASH_PROFILE` is what selects
; the board probe, and the suite's last case is the disabled build: it asserts
; `kFlashProfileEnabled` is false and that the gate the shipped build compiles
; (`FlashProfileReport<false>`) emits nothing. The enabled form is instantiated
; explicitly in the same binary, so both halves of the gate are covered here and
; the probe still never needs flash, a partition or `esp_timer.h`.
; -----------------------------------------------------------------------------
[env:flashprof_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to
; the test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/FlashProfile.cpp>
test_filter = unit/test_flashprof*

; -----------------------------------------------------------------------------
; zone_test -- host-only tests for the zone allocator.
;
; The arena is a local array in every case, so the tests need no filesystem, no
; flash and no engine. `#include "z_zone.h"` is what makes PlatformIO build
; lib/doom/z_zone.c with the C compiler, exactly as the firmware builds it; the
; suite then exercises allocation, coalescing, tags, purges, the 68,168 B
; refusal and the accounting identity through the public C API only.
; -----------------------------------------------------------------------------
[env:zone_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_zone*

; -----------------------------------------------------------------------------
; rdat_test -- host-only tests for the picture decoders.
;
; Same shape as wad_test, whd_test and zone_test and for the same reason: the
; decoders take buffers and know nothing about flash, files, the container or
; the zone, so every patch, texture directory, PNAMES table and flat the suite
; uses is assembled byte for byte inside the test file. `#include "r_data.h"`
; is what makes PlatformIO build lib/doom/r_data.c with the C compiler, exactly
; as the firmware builds it, and this environment links nothing else from
; lib/doom/, which is what proves the decoders stayed independent of w_wad.c,
; whd.c and z_zone.c.
;
; There is no build_src_filter and no `test_build_src`: src/ has nothing to do
; with decoding a lump.
; -----------------------------------------------------------------------------
[env:rdat_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_rdat*

; -----------------------------------------------------------------------------
; rbsp_test -- host-only tests for the BSP walk.
;
; Same shape as wad_test, whd_test, zone_test and rdat_test: every map here is
; assembled byte for byte in the test file, in the 1993 WAD record layout, so
; this environment needs no WAD, no container, no display and no engine.
; `#include "r_bsp.h"` is what makes PlatformIO build lib/doom/r_bsp.c and its
; dependencies with the C compiler, exactly as the firmware builds them.
;
; The tests pin the culling rules and the clip list (a seg outside the frustum,
; behind the viewer, back-facing, and a near wall occluding a far one), the
; near-to-far BSP order, the plane key set, the R_CheckPlane split and widen
; rules, the plane cap, the map loader's index validation, and the spawn
; viewpoint rule.
;
; There is no build_src_filter and no `test_build_src`: src/ has nothing to do
; with the walk.
; -----------------------------------------------------------------------------
[env:rbsp_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_rbsp*

; -----------------------------------------------------------------------------
; rsegs_test -- host-only tests for the wall column emitter, the plane
; pass and the sprite/masked pass.
;
; Same shape as rbsp_test: every map here is assembled byte for byte in the test
; file, and so is every texture, flat, sprite patch and the COLORMAP lump, so
; this environment needs no WAD, no container, no display and no engine.
; `#include "r_segs.h"` and `#include "r_things.h"` are what make PlatformIO
; build r_segs.c, r_plane.c, r_things.c, r_light.c, r_bsp.c and their
; dependencies with the C compiler, exactly as the firmware builds them.
;
; The tests pin the tier order and the clip array updates, the far-wall clipping
; through ceilingclip[]/floorclip[], the transparency mask, the texture column
; wrap, the sky case that must not touch ceilingclip[], the light table
; selection, and the two texture validation errors that fail the whole call
; without writing a byte.
;
; The sprite cases pin the projection and its drawseg clipping (fully visible, half
; covered, fully covered, in front), the flip, a transparent post gap, the
; deferred masked mid texture and its painter order against flats and sprites,
; the non-resident and overflow failures, and the 52-byte drawseg layout.
; -----------------------------------------------------------------------------
[env:rsegs_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_rsegs*

; -----------------------------------------------------------------------------
; world_test -- host-only tests for the world core.
;
; Same shape as rbsp_test and rsegs_test and for the same reason: every map is
; assembled byte for byte in the test file and the zone is a local array, so
; this environment needs no WAD, no container, no display and no engine.
;
; `#include "p_setup.h"` is what makes PlatformIO build lib/doom/p_setup.c and
; everything it reaches with the C compiler, exactly as the firmware builds
; them: p_mobj.c, p_tick.c, p_action.c, m_random.c, z_zone.c, doom_map.c and --
; because a mobj finds its sector through the BSP -- r_bsp.c with its table
; layer. The generated tables are part of p_mobj.c's translation unit, so they
; are compiled here too and a table that stopped compiling would fail this env.
;
; The tests pin the spawn position rules (ONFLOORZ, ONCEILINGZ, an explicit z
; and MF_SPAWNCEILING), the refusal of a zone too small for a mobj, thinker
; order and deferred removal (including a thinker that removes itself), the
; state machine and its zero-tic chain, upstream's first sixteen random
; numbers, and the map-thing filters: skill bits, the single-player bit,
; MF_COUNTKILL/MF_COUNTITEM totals, player starts and deathmatch starts.
; -----------------------------------------------------------------------------
[env:world_test]
platform = native
test_framework = unity
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -O2
    -Wall
    -Wextra
test_filter = unit/test_world*

; -----------------------------------------------------------------------------
; frameprof_test -- host-only tests for the frame-driver arithmetic.
;
; The arithmetic and the lines, not the board: `FrameDriver.cpp`'s first half is
; engine-free, Arduino-free and esp_timer-free by construction, so this
; environment filters it to that one file and installs no library dependency at
; all. There is no partition, no container, no display and no hardware here.
;
; The cases pin the mean/min/max over N frames, the residency per-mille, the
; gate boundary at exactly 20,000 us (19,999 and 20,000 pass, 20,001 fails), the
; zero-sample summary (no division, `gate=none`), and the ten-thousandth frame
; line -- every field, in order, as a parser reads it.
;
; The flag is absent on purpose: `PIXELROOT32_DOOM_FRAME_PROBE` selects the board
; driver, and the suite's last case is the disabled build, which asserts
; `kFrameProbeEnabled` is false and that `FrameProfileReport<false>::frame()`
; writes nothing and calls no sink. The enabled form is instantiated explicitly
; in the same binary, so both halves of the gate are covered without the probe
; ever needing flash, a partition or `esp_timer.h`.
; -----------------------------------------------------------------------------
[env:frameprof_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to the
; test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/FrameDriver.cpp>
test_filter = unit/test_frameprof*

; -----------------------------------------------------------------------------
; save_test -- the save record and its differential gate.
;
; Host-only. The record itself is engine-free (`src/doomc/SaveGame.*` includes
; lib/doom and nothing from PixelRoot32), and the suite builds a real E1M1 from
; tools/DOOM1.WAD so the differential compares 92-116 live mobjs, the sector
; deltas and the moving specials rather than a synthetic sketch. The WAD is
; copyrighted shareware data and is not committed: point DOOM_WAD at it, or
; leave it at tools/DOOM1.WAD, which is where the gate scripts already expect
; it.
;
; `#include "p_setup.h"` (through SaveGame.h) is what makes PlatformIO build
; lib/doom as a library, exactly as world_test does; `-Isrc` plus the
; build_src_filter compiles the writer/reader under test.
; -----------------------------------------------------------------------------
[env:save_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to
; the test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/SaveGame.cpp>
test_filter = unit/test_save*

; -----------------------------------------------------------------------------
; level_test -- the level transition, driven through the real switch.
;
; Host-only, and deliberately the *same* code the board runs: the composition
; between G_DoCompleted's switch and G_DoWorldDone's load lives in
; `src/doomc/LevelTransition.*`, which is engine-free (lib/doom plus <string.h>
; and nothing from PixelRoot32), so this suite cannot prove a path the firmware
; does not take.
;
; The suite builds real maps from tools/DOOM1.WAD and finds each exit line with
; the fixture the gate harnesses use (the front sector decides the side), then
; sends BT_USE through p_level_tic -> P_PlayerThink -> p_use_lines, exactly as a
; held B button does on the board. SaveGame.cpp is compiled too because the
; round-trip case writes its record on the E1M2 the transition loaded and reads
; it back: a save made after a level change loads into that level. DOOM_WAD or
; tools/DOOM1.WAD supplies the data, as in save_test.
; -----------------------------------------------------------------------------
[env:level_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to
; the test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/LevelTransition.cpp> +<doomc/SaveGame.cpp>
test_filter = unit/test_level*

; -----------------------------------------------------------------------------
; input_test -- host-only tests for the button -> ticcmd mapping.
;
; The mapping is a pure function: six button bits in, one `p_ticcmd_t` out. It
; has no clock, no engine, no display and no allocation, so this environment
; compiles `src/doomc/InputMap.cpp` alone and installs no library dependency.
; `#include "p_user.h"` from the test is what makes PlatformIO build lib/doom as
; a library, exactly as wad_test does for w_wad.h; the mapping calls no C
; function, so nothing from lib/doom is linked into the test binary.
;
; The cases pin upstream's literals (0x19 / 0x32 / 640 / BT_ATTACK / BT_USE),
; both turn signs, both cancellation rules, and the three combinations the table
; leaves open: B with a direction (inert), B while turning (not use) and A+B (both).
; -----------------------------------------------------------------------------
[env:input_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test:
; -fno-rtti is not repeated here because PlatformIO hands build_src_flags to
; the test framework's C sources too, where GCC can only warn about it.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/InputMap.cpp>
test_filter = unit/test_input*

; -----------------------------------------------------------------------------
; menu_test -- host-only tests for the menu's persistence seam and its palette
; effect.
;
; The state machine is gated by tools/menu_check.py (C harness against a reference
; model). This suite is what that gate cannot see from C: the C++ seams
; (src/doomc/SettingsStore.h) driven with an in-memory store -- a saved record
; surviving a "reboot", damaged and missing records falling back to the defaults,
; a failed write keeping the old record, the eight bytes surviving the migration
; onto the engine's IKeyValueStore -- the LOAD/SAVE navigation and the
; action the menu returns, and palette::applyGamma() rewriting the PLAYPAL tables
; in place. lib/doom is built as a library by PlatformIO exactly as in input_test,
; so m_menu.c and m_gamma.c are linked.
; -----------------------------------------------------------------------------
[env:menu_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
    ; The settings seam has an implementation over the engine's
    ; `IKeyValueStore`. This environment compiles that header (it is
    ; header-only: the interface plus the in-RAM adapter) but links no engine
    ; object, so the include path points at the same libdeps the other host
    ; environments use and the persistence module is switched on for the
    ; preprocessor. No new library dependency is installed.
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -D PIXELROOT32_ENABLE_PERSISTENCE=1
    -D DOOM_PERSISTENCE=1
    ; The engine's own platform switch: without it EngineConfig.h wants the real
    ; Arduino.h, which a native environment does not have. env:native sets it the
    ; same way through [base_native], and SDL_MAIN_HANDLED keeps SDL from
    ; renaming this file's `main` to `SDL_main` (the engine's host headers pull
    ; SDL in; there is no window in this suite).
    -D PLATFORM_NATIVE=1
    -D SDL_MAIN_HANDLED=1
build_src_flags =
    -fno-exceptions
build_src_filter = +<palette/DoomPalette.cpp>
test_filter = unit/test_menu*

; -----------------------------------------------------------------------------
; boot_test -- host-only tests for the boot/failure screens.
;
; The pixel record is gated by tools/boot_check.py (the firmware's own painter,
; compiled on the host and hashed against tools/boot_screens.txt). This suite
; owns the rules a hash cannot state: every WHD open code reaches a reason, the
; taxonomy's titles/bodies/hints are distinct and obey the embedded font's
; alphabet and the 25-character line, the two builders produce the documented
; screens, and the painter writes inside a 1x1 and a 320x200 buffer.
;
; Only the two engine-free translation units are built. `doomc/WhdSource.h` is
; included for its macros; lib/doom is found as a project library, and no flash
; adapter source is compiled here.
; -----------------------------------------------------------------------------
[env:boot_test]
platform = native
test_framework = unity
test_build_src = true
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/BootScreen.cpp> +<doomc/LevelFailure.cpp>
test_filter = unit/test_boot*

; -----------------------------------------------------------------------------
; sound_test -- host-only tests for DOOM's channel layer and the SFX bank.
;
; Engine-free and APU-free: lib/doom/s_sound.c is compiled as C and linked
; against a test double for the seven seam functions (doom_sound_start() and
; friends), so the channel table, the priority steal, the link rule, the
; distance culling and the M_Random jitter are all exercised through the public
; C API with no board, no engine and no audio device. `src/doomc/SfxBank.cpp`
; is compiled by build_src_filter -- it is engine-free by construction -- so the
; bank's 108 cues and the pure 8 -> 4 selector are asserted here too.
;
; `#include "s_sound.h"` is what makes PlatformIO build s_sound.c and sounds.c
; as C, exactly as the firmware builds them, and the C header of p_mobj.h is
; what pulls in the type the origin argument names.
; -----------------------------------------------------------------------------
[env:sound_test]
platform = native
test_framework = unity
test_build_src = true
; The bank carries its ADSR as an `InstrumentPreset` (AudioEvent has no
; other channel for it), so this env needs the APU header for that type. Same
; registry dependency the engine itself declares, so both resolve to 2.x.
lib_deps = gperez88/PixelRoot32-APU@^2.0.0
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D UNITY_SUPPORT_64
    -Isrc
    -O2
    -Wall
    -Wextra
; Same exception switch as the firmware, for the same reason as clock_test.
build_src_flags =
    -fno-exceptions
build_src_filter = +<doomc/SfxBank.cpp> +<doomc/MusicBank.cpp> +<doomc/AudioTelemetry.cpp>
test_filter = unit/test_sound*

