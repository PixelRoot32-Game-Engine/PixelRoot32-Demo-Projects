; Phase 0 measurement firmware for the DOOM-on-ESP32 feasibility audit.
;
; This project is throwaway scaffolding: it measures the board and the engine's
; present path, carries no DOOM code, and is deleted when Phase 0 closes. It
; deliberately sits at games/doom/bench/ (depth 4) so the demo CI, which
; discovers <category>/<demo>/platformio.ini at depth 3, never builds it.
;
; Every environment is the same firmware; only the build flags change. That is
; the point: each probe is the flag matrix's dependent variable.
;
; The committed lib_deps is the branch ref. Local builds point that one line at
; the local worktree and restore it before committing -- a committed local path
; dependency fails the demo CI structure job because it exists only on its
; author's machine.

[platformio]
default_envs = bench_st7789_40

; -----------------------------------------------------------------------------
; Shared flags. Mirrors games/doom/lib/platformio.ini: C++17, no exceptions,
; no RTTI, and every engine module that DOOM does not use switched off. Audio
; is off too: the bench measures the display path, and Phase 0's DRAM gate is
; defined with the display path live and before DOOM's own buffers.
;
; PIXELROOT32_DEBUG_MODE makes TFT_eSPI_Drawer print the DMA-block fallback
; warning. Without it D0.2 could report a requested block size the board did not
; actually allocate. Logging is init-only, so it does not touch the present
; measurement.
; -----------------------------------------------------------------------------
[bench_base]
build_unflags =
    -std=gnu++11
build_flags =
    -Wl,--gc-sections
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -Os
    -Wall
    -Wextra
    -D PIXELROOT32_DEBUG_MODE=1
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    -D PIXELROOT32_ENABLE_CAMERA_EFFECTS=0
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=60

[bench_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = ${bench_base.build_unflags}
build_flags = ${bench_base.build_flags}
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/doom-esp32

; -----------------------------------------------------------------------------
; Primary board: the square ST7789 240x240 with the pong pin map (S1).
; The physical window is 240x180, centred vertically with 30 px bars, showing
; DOOM's 320x200 logical surface squashed 0.75x (PLAN 6.1, configuration C2).
; -----------------------------------------------------------------------------
[bench_st7789]
extends = bench_esp32
build_flags =
    ${bench_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=180
    -D LOGICAL_WIDTH=320
    -D LOGICAL_HEIGHT=200
    -D Y_OFF_SET=30
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_READ_FREQUENCY=20000000

; D0.1 clock sweep.
[env:bench_st7789_40]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=40000000
    -D BENCH_ENV_NAME=\"bench_st7789_40\"

[env:bench_st7789_55]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=55000000
    -D BENCH_ENV_NAME=\"bench_st7789_55\"

[env:bench_st7789_80]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=80000000
    -D BENCH_ENV_NAME=\"bench_st7789_80\"

; D0.1 + D0.2 combined: the configuration the demo ships after Phase 0 -- the
; 80 MHz clock the sweep picked, with the 20-line DMA block the DRAM budget
; requires. This is the number the frame budget must be built on; the two sweep
; groups above exist to justify it, not to be shipped.
[env:bench_ship]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=80000000
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=20
    -D BENCH_ENV_NAME=\"bench_ship\"

; D0.1 on the panel the port actually ships on: the CYD in landscape, 320x200 at
; 1:1 with 20 px bars. 320x200 is 128,000 wire bytes in RGB565, so this row is
; 1.48x the transfer of the 240x180 window and must be measured, not divided.
[env:bench_ili9341_80]
extends = bench_ili9341
build_flags =
    ${bench_ili9341.build_flags}
    -D SPI_FREQUENCY=80000000
    -D BENCH_ENV_NAME=\"bench_ili9341_80\"

; The same window in packed RGB444. The drawer only takes this path when
; physicalWidth % 4 == 0, which 320 is, and it drops the wire to 96,000 bytes.
; The cost is 4 bits per channel against DOOM's 256-colour palette.
[env:bench_ili9341_80_444]
extends = bench_ili9341
build_flags =
    ${bench_ili9341.build_flags}
    -D SPI_FREQUENCY=80000000
    -D PIXELROOT32_TFT_12BIT_COLOR=1
    -D BENCH_ENV_NAME=\"bench_ili9341_80_444\"

; D0.2 block-size matrix, all at the 40 MHz baseline.
[env:bench_lpb60]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=40000000
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=60
    -D BENCH_ENV_NAME=\"bench_lpb60\"

[env:bench_lpb30]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=40000000
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=30
    -D BENCH_ENV_NAME=\"bench_lpb30\"

[env:bench_lpb20]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=40000000
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=20
    -D BENCH_ENV_NAME=\"bench_lpb20\"

[env:bench_lpb16]
extends = bench_st7789
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=40000000
    -D PIXELROOT32_TFT_ESPI_LINES_PER_BLOCK=16
    -D BENCH_ENV_NAME=\"bench_lpb16\"

; D0.5: same ST7789 baseline, but the app + mmap'd WAD partition table from
; PLAN 6.4. Every other environment has the default table, so pressing 5 there
; correctly reports partition_missing.
[env:bench_flash]
extends = bench_st7789
board_build.partitions = partitions_wad.csv
build_flags =
    ${bench_st7789.build_flags}
    -D SPI_FREQUENCY=40000000
    -D BENCH_ENV_NAME=\"bench_flash\"

; -----------------------------------------------------------------------------
; Secondary board: the ESP32-2432S028 "Cheap Yellow Display", an ILI9341
; 240x320 panel rotated a quarter turn. The 320x200 window fits natively with
; 20 px bars, so C1 shows DOOM's surface 1:1 (PLAN 6.1).
;
; The bench drives TFT_eSPI_Drawer directly instead of going through
; DisplayConfig: DisplayConfig::applyRotationNormalization() swaps width and
; height for odd rotations, which cannot express a 320x200 sub-window of a
; rotated 320x240 panel (it would turn the window into 200x320). The flags
; below are therefore the effective values the drawer receives.
; -----------------------------------------------------------------------------
[bench_ili9341]
extends = bench_esp32
build_flags =
    ${bench_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=320
    -D PHYSICAL_DISPLAY_HEIGHT=200
    -D LOGICAL_WIDTH=320
    -D LOGICAL_HEIGHT=200
    -D Y_OFF_SET=20
    -D DISPLAY_ROTATION=3
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_READ_FREQUENCY=20000000

[env:bench_ili9341_55]
extends = bench_ili9341
build_flags =
    ${bench_ili9341.build_flags}
    -D SPI_FREQUENCY=55000000
    -D BENCH_ENV_NAME=\"bench_ili9341_55\"
