; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; --- Engine features used by this demo ---
    ; Touch is the only input this demo has: pieces move by drag and drop.
    -D PIXELROOT32_ENABLE_TOUCH=1
    ; Move / capture / check / checkmate cues. Costs the most RAM of any gate
    ; here -- about 17 KB, nearly all of it the scheduler's own buffers.
    -D PIXELROOT32_ENABLE_AUDIO=1
    ; Pieces are 4bpp sprites, the format the other engine demos use.
    ;
    ; NOTE: the sprite-depth flags are tested with #ifdef, not #if, so ANY value
    ; turns them on -- "-D PIXELROOT32_ENABLE_2BPP_SPRITES=0" would link the 2bpp
    ; blitter in, not out. Define the ones you want and omit the rest. Several
    ; engine examples get this wrong; see include/platforms/EngineConfig.h:399.
    -D PIXELROOT32_ENABLE_4BPP_SPRITES
    ; Debris burst when a piece is taken. One emitter, 50-particle fixed pool,
    ; ~1.3 KB RAM. Its update/draw loops run all 50 slots every frame whether
    ; particles are alive or not, so a bigger burst costs nothing extra --
    ; a SECOND emitter would.
    -D PIXELROOT32_ENABLE_PARTICLES=1
    ; Screen shake on a capture. The board never scrolls, so Camera2D sits at
    ; the origin and this flag is the only reason the camera exists at all.
    -D PIXELROOT32_ENABLE_CAMERA_EFFECTS=1
    ; The promotion picker runs on the engine's headless DialogRunner
    ; (src/dialog/). DialogBox is compiled in by the same flag but never drawn:
    ; the picker's options are piece sprites, and DialogBox draws text.
    -D PIXELROOT32_ENABLE_DIALOG=1
    ; --- Palettes ---
    ; A Color is an INDEX into the loaded palette, not a colour, so these two
    ; lines decide what every colour in the demo actually looks like. Names are
    ; PaletteType members: PR32, NES, GB, GBC, PICO8.
    ;
    ; The board and the pieces are on SEPARATE palettes (dual palette mode), so
    ; either can be reskinned without touching the other. Try "-D
    ; CHESS_BACKGROUND_PALETTE=GB" for a Game Boy board under PR32 pieces.
    ;
    ; Whatever you pick, re-run tools/generate_pieces.py: its check_contrast()
    ; walks every palette registered in PALETTES and fails the build rather than
    ; shipping a piece outline the player cannot see against a square.
    -D CHESS_BACKGROUND_PALETTE=PR32
    -D CHESS_SPRITE_PALETTE=PR32
    ; Set to 1 to draw the board through src/assets/ChessCustomPalette.h - a
    ; generated 16-slot table, PR32 with only the two board slots re-pointed.
    -D CHESS_CUSTOM_BACKGROUND=1
    ; --- Explicitly off (these ARE #if-tested, so =0 works) ---
    ; The HUD is a handful of rectangles hit-tested in the scene, so the UI
    ; system would only add flash. Turn these on before reaching for them.
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    ; Default to 1 in the engine and dead weight here: there is a single scene,
    ; and nothing draws a tilemap.
    -D PIXELROOT32_ENABLE_SCENE_TRANSITIONS=0
    -D PIXELROOT32_ENABLE_STATIC_TILEMAP_FB_CACHE=0

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
