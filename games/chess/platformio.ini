; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; -----------------------------------------------------------------------------
; native — SDL2 simulator. The SDL2 drawer forwards mouse events to the touch
; dispatcher, so the mouse acts as the finger and the layout matches the CYD 1:1.
; -----------------------------------------------------------------------------
[env:native]
extends = base_native
; Temporary: the Dialog System only exists on the engine's feature branch.
; Repin to gperez88/PixelRoot32-Game-Engine@^1.11.0 once 1.11.0 is released.
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/dialog-system
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; -----------------------------------------------------------------------------
; esp32cyd — ESP32-2432S028 "Cheap Yellow Display": ILI9341 240x320 + XPT2046
; resistive touch. Touch wiring and calibration follow the engine's 2048 example.
; -----------------------------------------------------------------------------
[env:esp32cyd]
extends = base_esp32
board = esp32dev
framework = arduino
; Temporary: the Dialog System only exists on the engine's feature branch.
; Repin to gperez88/PixelRoot32-Game-Engine@^1.11.0 once 1.11.0 is released.
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/dialog-system
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32CYD
    ; TFT config (ILI9341_2 240x320)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; Touch: XPT2046 on its own GPIO bus (32/39/25/33, IRQ 36), not on the TFT SPI
    -D TOUCH_DRIVER_XPT2046
    -D XPT2046_USE_GPIO_SPI
    -D XPT2046_GPIO_VENDOR_COORDS=0
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
    ; ADC X/Y are swapped vs the display on the 2432S028
    -D XPT2046_GPIO_SWAP_AXES=1
    ; Horizontal mirror: left/right are inverted after the axis swap
    -D XPT2046_GPIO_MIRROR_X=1
    ; Map the usable ADC range onto the full screen (resistive rarely reaches 0-4095).
    ; Retune LO/HI by touching the corners and reading the serial monitor.
    -D XPT2046_GPIO_USE_RAW_RANGE=1
    -D XPT2046_RAW_X_LO=320
    -D XPT2046_RAW_X_HI=3820
    -D XPT2046_RAW_Y_LO=320
    -D XPT2046_RAW_Y_HI=3820
    ; Applied after the mirror, in final screen space
    -D XPT2046_CAL_OFFSET_X=0
    -D XPT2046_CAL_OFFSET_Y=0
    -Isrc
    -O2

; -----------------------------------------------------------------------------
; host_test — host-only unit tests for src/chess/. That layer has no engine
; dependency on purpose, so `pio test -e host_test` needs no display and runs
; every suite under test/ (test_rules, test_game).
; -----------------------------------------------------------------------------
[env:host_test]
platform = native
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -D UNITY_SUPPORT_64   ; perft counts exceed 32 bits, Unity needs this to compare them
    -Isrc
    -O2
    -Wall
    -Wextra
build_src_filter = +<chess/>
test_framework = unity
test_build_src = true
; The promotion picker's suite needs the engine; see dialog_test.
test_ignore = test_dialog_*

; -----------------------------------------------------------------------------
; dialog_test -- host-only unit tests for src/dialog/, the game-side adapter
; over the engine's headless DialogRunner.
;
; Kept apart from host_test on purpose: that suite proves src/chess/ has no
; engine dependency, and this adapter exists precisely to hold one. The engine
; is installed but NOT built as a library (lib_ignore), because that would drag
; the SDL2 simulator in. The suite compiles DialogRunner.cpp on its own instead,
; and test/support/Arduino.h stands in for the one Arduino symbol
; EngineConfig.h reads, so this suite needs no display and no SDL2 either.
; -----------------------------------------------------------------------------
[env:dialog_test]
platform = native
; Same temporary pin as the simulator and the board; repin with them.
lib_deps = https://github.com/PixelRoot32-Game-Engine/PixelRoot32-Game-Engine.git#feature/dialog-system
lib_ignore = PixelRoot32-Game-Engine
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -fno-exceptions
    -D PIXELROOT32_ENABLE_DIALOG=1
    -Isrc
    -Itest/support
    -I.pio/libdeps/dialog_test/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/dialog_test/PixelRoot32-Game-Engine/src
    -O2
    -Wall
    -Wextra
build_src_filter = +<chess/> +<dialog/>
test_framework = unity
test_build_src = true
test_filter = test_dialog_*
