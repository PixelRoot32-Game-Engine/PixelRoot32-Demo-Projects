; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; --- The subsystem this demo IS about ---------------------------------
    ; Engine default is 0 (include/platforms/PlatformDefaults.h) and it is
    ; #if-tested, so the "=1" is required. It does not gate Scene's
    ; depthComparator member — that always compiles — it gates THIS demo's
    ; use of it, the same way games/bomberbot gates its own comparator.
    -D PIXELROOT32_ENABLE_DEPTH_SORT=1
    ; --- Subsystems this demo does NOT use, turned off on purpose ---------
    ; The topic is one comparator. Every subsystem left on would spend RAM
    ; that nothing on screen uses. Together these four release ~37 KB.
    -D PIXELROOT32_ENABLE_AUDIO=0      ; ~17 KB: mixer voices + command queue
    -D PIXELROOT32_ENABLE_PHYSICS=0    ; ~9 KB: CollisionSystem + scheduler
    -D PIXELROOT32_ENABLE_PARTICLES=0  ; ~2 KB: particle pool
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0  ; ~9 KB: UIManager widget/hit-test tables

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
