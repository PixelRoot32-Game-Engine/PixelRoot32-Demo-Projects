; Shared build templates for the Isometric Tilemap Export demo.
;
; Kept in a separate file, and pulled in through `extra_configs`, so the
; per-environment sections in platformio.ini stay short enough to read.

[base]
build_unflags =
	-std=gnu++11
build_flags =
    -Wl,--gc-sections
	-std=gnu++17
    -fno-exceptions
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    ; The cell-to-screen basis the exported ISO_PROJECTION is expressed in.
    ; Without it math/Projection.h compiles to nothing and the header's own
    ; static_asserts have no predicates left to evaluate.
    -D PIXELROOT32_ENABLE_PROJECTION=1
    ; The projected drawTileMap overload. This is the whole point of the
    ; example: without it the only drawTileMap available is the orthogonal
    ; one, which steps by tileWidth/tileHeight and cannot place a diamond.
    -D PIXELROOT32_ENABLE_TILEMAP_PROJECTION=1
    ; The export references pixelroot32::gameplay::RoomData behind this flag.
    -D PIXELROOT32_ENABLE_GAMEPLAY_ROOM=1
    ; gameplay/GridMotion.h, which the player uses to walk cell to cell. It
    ; shares this flag with GridSpace rather than taking one of its own, so an
    ; isometric game that never declares a GridSpec still has to enable it --
    ; the header says so itself.
    -D PIXELROOT32_ENABLE_GAMEPLAY_GRID_SPACE=1
    ; The art is 4bpp on custom 16-colour palettes. The engine gates its 4bpp
    ; draw paths with `if constexpr`, so building without this is not an
    ; error -- it is a black screen.
    -D PIXELROOT32_ENABLE_2BPP_SPRITES=0
    -D PIXELROOT32_ENABLE_4BPP_SPRITES=1
    ; Opt-in perf optimizations from docs/performance-isometric-esp32.md:
    ; dirty-skip per tile (iso-perf-cached-ground) + span-limited blit
    ; (iso-perf-blit-fastpath). Dirty regions only take effect on an 8bpp
    ; framebuffer (ESP32/TFT_eSPI); the native SDL2 driver skips them.
    -D PIXELROOT32_ENABLE_DIRTY_REGIONS=1

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-rtti

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
