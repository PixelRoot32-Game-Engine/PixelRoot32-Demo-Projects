; Isometric Tilemap Export
;
; Consumes a scene exported straight out of the PixelRoot32 Tilemap Editor:
; isometric projection, a single ground layer, one palette slot. Nothing in
; src/assets/ is hand-written -- it is the exporter's output, byte for byte.

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.10.0
build_flags =
    ${base_native.build_flags}
    ; 320x240, deliberately SMALLER than the map. An isometric map spans both
    ; screen axes at once, so this 36x29 export covers 1040x536 px -- roughly
    ; fifteen windows' worth. The view is meant to be a window onto it, not a
    ; frame around it: the scene sizes its scroll bounds from the map itself
    ; (expandProjectedMapBounds) and the camera clamps to them, so the corners
    ; that fall outside are scrolled to rather than lost.
    -D PHYSICAL_DISPLAY_WIDTH=320
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PIXELROOT32_ENABLE_DEBUG_OVERLAY
    -D PIXELROOT32_ENABLE_PROFILING
    -D PIXELROOT32_DEBUG_MODE
    -Isrc
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; Windows (MSYS2/MinGW). On macOS/Homebrew swap these for
    ; -I/opt/homebrew/include and -L/opt/homebrew/lib.
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32dev]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.10.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PIXELROOT32_ENABLE_DEBUG_OVERLAY
    -D PIXELROOT32_ENABLE_PROFILING
    -D PIXELROOT32_DEBUG_MODE
    -D PLATFORM_ESP32DEV
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -Os
