; Shared build templates for the Isometric Rooms Export demo.
;
; Kept in a separate file, and pulled in through `extra_configs`, so the
; per-environment sections in platformio.ini stay short enough to read.

[base]
build_unflags =
	-std=gnu++11
build_flags =
    -Wl,--gc-sections
	-std=gnu++17
    -fno-exceptions
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    ; The cell-to-screen basis the exported ISO_PROJECTION is expressed in,
    ; and the projected drawTileMap / buildRoomGraph overloads built on it.
    -D PIXELROOT32_ENABLE_PROJECTION=1
    -D PIXELROOT32_ENABLE_TILEMAP_PROJECTION=1
    ; RoomGraph plus the exported ROOM_LAYER / ROOMS tables. Off, the export's
    ; room block compiles to nothing and the scene has no rooms to enter.
    -D PIXELROOT32_ENABLE_GAMEPLAY_ROOM=1
    ; The export is 4bpp: the tileset and every room map sit behind this flag.
    -D PIXELROOT32_ENABLE_2BPP_SPRITES=0
    -D PIXELROOT32_ENABLE_4BPP_SPRITES=1

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-rtti

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
