; Isometric Rooms Export
;
; Consumes an isometric scene with rooms exported by the PixelRoot32 Tilemap
; Editor: one map per room on a shared tileset (ROOM_LAYERS[]), a room graph
; built with the projected buildRoomGraph overload, and each room drawn through
; roomProjection(). The tilesets live in editor/assets/tilesets/;
; src/assets/tilemap/ is the editor's export, untouched.
;
; Needs engine 1.15.0 or later: the projected buildRoomGraph overload and
; roomProjection() first ship there.

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.15.0
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -Isrc
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; Windows (MSYS2/MinGW). On macOS/Homebrew swap these for
    ; -I/opt/homebrew/include and -L/opt/homebrew/lib.
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32dev]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = gperez88/PixelRoot32-Game-Engine@^1.15.0
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PLATFORM_ESP32DEV
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
