; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags = 
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; --- Subsystems this demo deliberately turns OFF ---------------------
    ; All four default to 1 in include/platforms/PlatformDefaults.h. The topic
    ; here is redraw cost, so every one of them is dead weight, and switching
    ; them off is half the lesson: a performance demo whose flag list is
    ; exactly its topic tells you what the topic costs on its own.
    ; Budget figures from the engine's memory-optimization notes:
    ; audio ~17 KB RAM, physics ~9 KB, UI system ~9 KB, particles ~2 KB.
    ; Together ~36 KB of ESP32 RAM that never gets reserved here.
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    ; --- The topic ---------------------------------------------------------
    ; Selective framebuffer clear. Renderer::beginFrame() clears only the 8x8
    ; cells that were marked during the previous frame instead of memsetting
    ; the whole logical framebuffer. Marking happens inside every Renderer
    ; primitive, so the saving is real only while the scene leaves most of the
    ; screen untouched -- which is what this demo is built to show.
    -D PIXELROOT32_ENABLE_DIRTY_REGIONS=1
    ; Makes Renderer::beginFrame() log "dirty_ratio=%.4f (marked/total)" once
    ; per frame. It is a console line, not an on-screen value: the DirtyGrid
    ; member of Renderer is private and has no public accessor.
    -D PIXELROOT32_ENABLE_DIRTY_REGION_PROFILING=1
    ; Tested with defined(), not with #if, so it carries no value. Two things
    ; need it: the dirty_ratio log above (its #if ANDs both) and
    ; Renderer::drawDebugDirtyCellOverlay(), which is compiled to an empty
    ; body without it.
    -D PIXELROOT32_DEBUG_MODE

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags = 
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags = 
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
