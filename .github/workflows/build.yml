name: build

# Pull requests build only the demos the pull request touches, plus a weekly
# full build as the safety net. Everything reaches main through a pull request,
# so a push-triggered run on main would rebuild the tree the PR just proved
# green — roughly seven minutes of runner time for no new information.
#
# The trade-off, stated so it is a choice and not an accident: nothing builds
# main after a merge. GitHub tests a PR against main as it was when the run
# started, so two PRs that are green apart can still merge into a broken main.
# The weekly run closes that gap for demos no PR touches; re-run this workflow
# from the Actions tab (workflow_dispatch), or label a PR `full-ci`, when a
# merge looks risky.
on:
  pull_request:
  workflow_dispatch:
  # Weekly full build: the demos nothing touched since the last run.
  schedule:
    - cron: '0 4 * * 1'

# A new push to the same branch cancels the previous run: the matrix is wide
# and there is no value in finishing a build nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Decide what to build. A demo is any <category>/<demo>/platformio.ini at
  # depth 3; lib/platformio.ini sits one level deeper and is a template, not a
  # project. Discovering instead of hardcoding means a new demo is built the day
  # it lands.
  #
  # On a pull request the list is narrowed to the demos whose files changed, so
  # a PR that touches only `games/doom` does not rebuild the other 38. Manual
  # runs and the schedule build everything. Two things force a full run:
  # a change under `.github/` (the CI has to prove itself) and the `full-ci`
  # label.
  # ---------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      demos: ${{ steps.list.outputs.demos }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff against the pull request's base needs its history.
          fetch-depth: 0

      - id: list
        run: |
          all=$(find . -mindepth 3 -maxdepth 3 -name platformio.ini \
            | sed 's|^\./||; s|/platformio\.ini$||' \
            | sort)

          files=""
          full=0
          # A pull_request checkout is a synthetic merge commit: its first parent
          # is the base tip GitHub merged onto, its second parent is the pull
          # request head. Diffing those two is the pull request's own change set.
          #
          # Not the event payload's `base.sha`: when it lags behind the base
          # branch, `git diff <that sha> HEAD` also reports everything main
          # changed since the fork, so a game-only pull request reads as touching
          # `.github/` (main's CI commit) and rebuilds the whole fleet.
          if git rev-parse --verify -q HEAD^2 >/dev/null; then
            files=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
            echo "base=$(git rev-parse --short HEAD^1) head=$(git rev-parse --short HEAD^2)"
          else
            full=1
          fi

          # Bounded, so the log says what the decision was based on.
          echo "$files" | head -20

          # A workflow change builds everything: the only way to know the CI
          # still works is to run all of it.
          if echo "$files" | grep -Eq '^\.github/'; then
            full=1
          fi

          # Root entries that are not documentation are repo-wide too. The
          # emptiness guards matter twice over: `echo ""` is one blank line,
          # which would read as a root entry outside the allowlist, and a
          # non-matching grep exits 1, which `set -e` turns into a failed step.
          if [ -n "$files" ]; then
            root=$(echo "$files" | grep -Ev '/' || true)
            if [ -n "$root" ]; then
              bad=$(echo "$root" \
                | grep -Ev '^(README\.md|CONTRIBUTING\.md|LICENSE|\.editorconfig|\.gitignore)$' \
                || true)
              if [ -n "$bad" ]; then
                full=1
              fi
            fi
          fi

          # Escape hatch for a pull request that suspects a shared assumption.
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}" = "true" ]; then
            full=1
          fi

          if [ "$full" = "1" ]; then
            changed="$all"
          else
            changed=$(echo "$files" | awk -F/ 'NF>=3 {print $1"/"$2}' | sort -u)
          fi

          demos=$(comm -12 <(echo "$all") <(printf '%s\n' "$changed" | sed '/^$/d') \
            | jq -R . | jq -sc .)
          echo "demos=$demos" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$demos" = "[]" ] && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
          echo "Discovered demos: $all"
          echo "Building: $demos (full=$full)"

  # ---------------------------------------------------------------------------
  # Structure check — the rules CONTRIBUTING.md states, enforced. Cheap, and it
  # fails in seconds instead of after a 20-minute matrix. It runs on the same
  # narrowed list as the build: a new demo is always in it.
  # ---------------------------------------------------------------------------
  structure:
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - uses: actions/checkout@v7

      - name: Every demo has the required files and environments
        run: |
          status=0
          for demo in $(echo '${{ needs.discover.outputs.demos }}' | jq -r '.[]'); do
            for file in README.md lib/platformio.ini src/main.cpp; do
              if [ ! -f "$demo/$file" ]; then
                echo "::error file=$demo::missing required file $file"
                status=1
              fi
            done

            envs=$(sed -n 's/^\[env:\(.*\)\]/\1/p' "$demo/platformio.ini")

            if ! echo "$envs" | grep -qx 'native'; then
              echo "::error file=$demo/platformio.ini::no [env:native] — every demo must build the SDL2 simulator"
              status=1
            fi

            # At least one hardware environment. "native" is the simulator and
            # anything matching *test* is a host suite, so neither counts.
            if [ -z "$(echo "$envs" | grep -v -e '^native$' -e 'test')" ]; then
              echo "::error file=$demo/platformio.ini::no hardware environment — a demo with only [env:native] does not land"
              status=1
            fi

            if grep -q 'symlink://' "$demo/platformio.ini" "$demo/lib/platformio.ini"; then
              echo "::error file=$demo/platformio.ini::symlink:// dependency committed — it points at a path only its author has"
              status=1
            fi
          done
          exit $status

  # ---------------------------------------------------------------------------
  # Build every environment of every demo. One job per demo rather than one per
  # (demo, environment) pair: the ESP32 toolchain is downloaded once per job, so
  # splitting further would multiply the download, not the parallelism that pays.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: [discover, structure]
    # An empty matrix is a job failure, and a documentation-only pull request
    # legitimately has nothing to build.
    if: needs.discover.outputs.any == '1'
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJson(needs.discover.outputs.demos) }}
    name: build ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Toolchains and platform packages, not library dependencies: lib_deps
      # uses a caret range, so caching .pio/libdeps would pin the demos to
      # whatever engine release was current when the cache was written.
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The native environment links against SDL2; the ESP32 ones do not.
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsdl2-dev

      # The committed [env:native] build_flags target Windows/MSYS2. Strip the
      # MSYS2 include/library paths and -mconsole so the same file builds with
      # the distribution SDL2 headers. The macOS Homebrew lines stay commented.
      - name: Apply the Linux variant of the native build flags
        run: sed -i -e '/msys64/d' -e '/-mconsole/d' "${{ matrix.demo }}/platformio.ini"

      # Environments whose name contains "test" are host suites and belong to
      # the test job, which runs them with `pio test` rather than `pio run`.
      - name: Build every non-test environment
        working-directory: ${{ matrix.demo }}
        run: |
          status=0
          for env in $(sed -n 's/^\[env:\(.*\)\]/\1/p' platformio.ini | grep -v test); do
            echo "::group::${{ matrix.demo }} — $env"
            pio run -e "$env" || status=1
            echo "::endgroup::"
          done
          exit $status

  # ---------------------------------------------------------------------------
  # Host-side unit tests. The suites are hand-maintained on purpose, per
  # CONTRIBUTING.md: adding a *_test environment to a demo is not enough, the
  # suite has to be listed in .github/test-matrix.json or CI never runs it.
  #
  # A matrix cannot be filtered by an `if` (the condition is evaluated before the
  # matrix is expanded), so the filtering happens in `test_plan`: it intersects
  # the hand-maintained list with the demos the pull request touches and hands
  # the result to `test`. A pull request that leaves every listed suite untouched
  # skips the job instead of expanding an empty matrix.
  # ---------------------------------------------------------------------------
  test_plan:
    runs-on: ubuntu-latest
    needs: discover
    outputs:
      include: ${{ steps.filter.outputs.include }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v7

      - id: filter
        env:
          DEMOS: ${{ needs.discover.outputs.demos }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          demos = set(json.loads(os.environ["DEMOS"]))
          rows = json.loads(pathlib.Path(".github/test-matrix.json").read_text(encoding="utf-8"))
          keep = [row for row in rows if row["demo"] in demos]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("include=" + json.dumps(keep) + "\n")
              fh.write("any=" + ("1" if keep else "0") + "\n")

          print(f"{len(keep)} of {len(rows)} suites selected: {keep}")
          PY

  test:
    runs-on: ubuntu-latest
    needs: [discover, test_plan]
    if: needs.test_plan.outputs.any == '1'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test_plan.outputs.include) }}
    name: test ${{ matrix.demo }} (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # These environments build a host-only rules layer with no engine and no
      # display, so SDL2 is deliberately not installed here: if a test suite
      # starts needing it, the layer under test has grown a dependency it was
      # designed not to have. The dialog_test suites are the one exception to
      # "no engine": they compile DialogRunner.cpp alone, which needs no SDL2.
      # The networking integration suite is the other, explicit exception: it
      # drives the real NetSession over the loopback transport, and the engine's
      # native layer always compiles its SDL2 drawer, audio backend and input
      # manager, so the headers must exist. Keep this step scoped to that row.
      - name: Install SDL2 for the engine-backed network suite
        if: matrix.env == 'net_test'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsdl2-dev

      - name: Run the suite
        working-directory: ${{ matrix.demo }}
        run: pio test -e ${{ matrix.env }}
