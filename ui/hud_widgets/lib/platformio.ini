; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    ; --- The one subsystem this demo IS about ----------------------------
    ; Every header under graphics/ui/ is wrapped in #if on this flag, so
    ; without it UILabel, UIPanel, UISpriteRow and UIAnchorLayout do not
    ; exist as types and the build stops in HudWidgetsScene.h.
    ; Costs roughly 9 KB of RAM, mostly UIManager's widget and hit-test
    ; tables — which this demo never touches, but which come with the module.
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1
    ; --- Subsystems this demo does NOT use, turned off on purpose ---------
    ; A demo enables the minimum set of flags its topic needs. The topic is
    ; a HUD that ignores the camera, so nothing below it would ever run.
    -D PIXELROOT32_ENABLE_AUDIO=0      ; ~17 KB: mixer voices + command queue
    -D PIXELROOT32_ENABLE_PHYSICS=0    ; ~9 KB: CollisionSystem + scheduler
    -D PIXELROOT32_ENABLE_PARTICLES=0  ; ~2 KB: particle pool
    ; No sprite bit-depth flag. The heart icons are 1bpp `Sprite`, which the
    ; renderer always supports; PIXELROOT32_ENABLE_2BPP_SPRITES and
    ; _4BPP_SPRITES are #ifdef-tested, so writing either as "=0" would still
    ; switch it on and pull in a decoder no icon here needs.

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
